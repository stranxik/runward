# runward-run on GitLab (runward ADR-0120 decision 5), at parity with samples/github/runward-run.yml.
# An inert sample: runward installs nothing.
#
# WHERE IT RUNS. In the pipeline of a project the agent cannot write (the "runner project"), run for the
# mission's commit, so that the signing identity is that project's and not the mission's. The mission's
# own pipeline only triggers it (a downstream pipeline):
#
#   runward-run:
#     trigger: { project: your-group/runward-runner, strategy: depend }
#     variables: { RUNWARD_MISSION_PROJECT: $CI_PROJECT_PATH, RUNWARD_MISSION_SHA: $CI_COMMIT_SHA, RUNWARD_MISSION_REF: $CI_COMMIT_REF_NAME }
#
# The trigger names a commit; it chooses nothing about how the run executes. The run policy lives in this
# file (the job "execute" writes it), never in the mission.
#
# Three jobs, as on GitHub:
#   execute  runs the project's code with runward-run, in a container pinned by digest with the network
#            cut. No `id_tokens`, and no CI/CD variable holds a key. (GitLab gives every job a
#            CI_JOB_TOKEN: here it reads the mission and signs nothing.)
#   sign     runs no project code; it checks the hand-over and signs the run Statement: keyless where
#            the instance offers Sigstore (gitlab.com, `id_tokens`), or with the operator's own key on an
#            instance that does not (an offline one): a protected, masked file variable of THIS project.
#   gate     reads the outputs as runward does, and verifies the signature against the operator's trust
#            policy (runward-fleet verify-run). A verdict for this pipeline; commit the outputs with the
#            tree to keep it re-derivable from the repository.
#
# With the docker executor and a docker:dind service, runward-run's scratch directory must sit under
# $CI_PROJECT_DIR, which the runner shares with the service (`--scratch` below); with a shell executor
# and a local Docker, the defaults apply. Each REPLACE marks what to set before use.
stages: [execute, sign, gate]

variables:
  RUNWARD_VERSION: "0.47.0"
  RUNWARD_SRC: "https://github.com/stranxik/runward.git" # REPLACE on an offline instance: your mirror
  RUNWARD_COMMIT: "0000000000000000000000000000000000000000" # REPLACE: the stranxik/runward commit you take runward-run from

execute:
  stage: execute
  image: docker:27.5.1-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  services:
    - name: docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - case "$RUNWARD_MISSION_SHA" in ""|*[!0-9a-f]*) echo "RUNWARD_MISSION_SHA is not a commit"; exit 2;; esac
    - case "$RUNWARD_VERSION" in ""|*[!0-9.]*) echo "invalid runward version"; exit 2;; esac
    - apk add --no-cache nodejs npm git
    - git clone --no-checkout "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${RUNWARD_MISSION_PROJECT}.git" mission
    - git -C mission checkout --detach "$RUNWARD_MISSION_SHA"
    - git clone --no-checkout "$RUNWARD_SRC" .runward-src && git -C .runward-src checkout --detach "$RUNWARD_COMMIT"
    - |
      cat > run-policy.json <<'POLICY'
      {
        "format": "runward-run-policy/0",
        "image": "node:24.22.1-bookworm-slim@sha256:be8204d4bd327363357f532187b752ff62759c31bedf98e9e18fc08c9cbd605c",
        "install": { "cwd": "code", "lockfile": "code/package-lock.json", "command": ["npm", "ci", "--ignore-scripts", "--no-audit", "--no-fund"] },
        "legs": [
          { "leg": "tests", "cwd": "code", "command": ["node", "--import", "tsx", "--test", "--test-reporter=junit", "--test-reporter-destination=${out}/code/reports/junit.xml", "test/*.test.ts"], "reports": [{ "path": "code/reports/junit.xml", "nature": "junit" }] },
          { "leg": "reports", "cwd": "code", "command": ["node", "--import", "tsx", "--test", "--experimental-test-coverage", "--test-coverage-include=src/**", "--test-reporter=lcov", "--test-reporter-destination=${out}/code/reports/lcov.info", "test/*.test.ts"], "reports": [{ "path": "code/reports/lcov.info", "nature": "coverage" }] },
          { "leg": "reports", "cwd": "code", "command": ["node", "scripts/lint-committable.mjs", "${out}/code/reports"], "reports": [{ "path": "code/reports/eslint.json", "nature": "eslint" }, { "path": "code/reports/eslint.sarif", "nature": "sarif" }] }
        ]
      }
      POLICY
    - set +e; npx --yes "runward@$RUNWARD_VERSION" check -p mission --strict --require attested --json > check.json; code=$?; set -e
    - '[ "$code" -eq 0 ] || [ "$code" -eq 1 ] || [ "$code" -eq 5 ] || { echo "runward check exited $code: no expected set"; exit 1; }'
    - mkdir -p "$CI_PROJECT_DIR/.runward-run-scratch"
    - >
      node .runward-src/packages/runward-run/src/cli.js run
      --policy run-policy.json --tree mission --check check.json --out out --runtime docker
      --scratch "$CI_PROJECT_DIR/.runward-run-scratch"
      --repository "$CI_SERVER_HOST/$RUNWARD_MISSION_PROJECT" --commit "$RUNWARD_MISSION_SHA" --ref "refs/heads/$RUNWARD_MISSION_REF"
    - sha256sum "$(find out -name runward-run.intoto.json)" | cut -d' ' -f1 > statement.sha256
  artifacts:
    paths: [out/, statement.sha256]
    expire_in: 1 week

sign:
  stage: sign
  needs: [execute]
  image: ghcr.io/sigstore/cosign/cosign:v2.6.1-dev@sha256:40523fa4ca7ba0d9930154f0f6e1730b7a57bee61cadc9612730dfc992bc8abc
  # Keyless, where the instance offers Sigstore: the OIDC identity of this project's pipeline. On an
  # instance that does not, remove `id_tokens` and sign with a key held by THIS project (a protected,
  # masked file variable COSIGN_PRIVATE_KEY, and COSIGN_PASSWORD): see the second command below.
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - ST=$(find out -name runward-run.intoto.json)
    - '[ "$(sha256sum "$ST" | cut -d" " -f1)" = "$(cat statement.sha256)" ] || { echo "the run Statement handed over is not the one the executing job wrote"; exit 1; }'
    - |
      grep -q '"predicateType": "https://runward.dev/run/v1"' "$ST" && grep -q '"network": "none"' "$ST" || { echo "not a run Statement of a run with the network cut"; exit 1; }
    - cosign attest-blob --yes --new-bundle-format --statement "$ST" --bundle "$(dirname "$ST")/runward-run.sigstore.json"
    # Offline instance, the operator's own key instead (no transparency log to upload to):
    #   cosign attest-blob --yes --new-bundle-format --key "$COSIGN_PRIVATE_KEY" --tlog-upload=false \
    #     --statement "$ST" --bundle "$(dirname "$ST")/runward-run.sigstore.json"
  artifacts:
    paths: [out/]
    expire_in: 1 week

gate:
  stage: gate
  needs: [sign]
  image: node:24.22.1-bookworm-slim@sha256:be8204d4bd327363357f532187b752ff62759c31bedf98e9e18fc08c9cbd605c
  script:
    - case "$RUNWARD_VERSION" in ""|*[!0-9.]*) echo "invalid runward version"; exit 2;; esac
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - git clone --no-checkout "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${RUNWARD_MISSION_PROJECT}.git" mission
    - git -C mission checkout --detach "$RUNWARD_MISSION_SHA"
    - cp -R out/. mission/
    - git clone --no-checkout "$RUNWARD_SRC" .runward-src && git -C .runward-src checkout --detach "$RUNWARD_COMMIT"
    # The trust policy is the operator's, in a project the agent cannot write. REPLACE the project path.
    - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/your-group/runward-trust.git" .trust
    - npx --yes "runward@$RUNWARD_VERSION" check -p mission --strict --require attested
    - BUNDLE=$(find mission -name runward-run.sigstore.json)
    - >
      node .runward-src/packages/runward-fleet/src/cli.js verify-run "$BUNDLE"
      --policy .trust/trust-policy.json --repository "$CI_SERVER_HOST/$RUNWARD_MISSION_PROJECT"
      --commit "$RUNWARD_MISSION_SHA" --statement "$(dirname "$BUNDLE")/runward-run.intoto.json"
