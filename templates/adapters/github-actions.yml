# runward gate — CI adapter (sample).
# Inert until you install it: see runward/adapters/README.md.
# Copy this job into a workflow under .github/workflows/, then make it a
# required status check on your protected branch so no gap merges.
#
# The gate is deterministic and zero-LLM: no secrets, no model key needed.
# Exit codes (the port contract): 0 clean · 1 gaps · 2 no mission, a usage error or a refused gesture: the question could not be asked, never a red gate.
name: runward gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The floor runward's own package declares (engines.node). Raising runward may raise
          # this: read `node -p "require('runward/package.json').engines.node"` (ADR-0070).
          node-version: 22
      # Use --strict to also enforce the floor rule-conformance manifest.
      # Drop --strict for the deliverable audit only.
      # --hooks first runs the `before` commands of runward/hooks.json: that is where a mission says
      # how to regenerate the reports it cites (JUnit, lint, coverage) and compare them with the ones
      # committed, so the gate never vouches for a report this tree does not produce (runward
      # ADR-0115). A hook that fails fails the gate. With no hooks.json nothing runs, and the run says
      # so. The commands are your repository's, trusted as `npm test` is: never run this job under
      # `pull_request_target` on an untrusted head.
      # The runward version that wrote this file (`runward init` / `runward update` stamp it): the
      # check runs that release whatever is published since. Raise it deliberately.
      - name: runward check
        run: npx --yes runward@{{RUNWARD_VERSION}} check --strict --hooks
