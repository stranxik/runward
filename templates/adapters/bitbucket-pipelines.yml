# runward gate — Bitbucket Pipelines adapter (sample, minimal: ADR-0094 decision 5).
# Inert until you install it: see runward/adapters/README.md.
# Merge the step into your bitbucket-pipelines.yml, then require a passing build before merge in
# the branch restrictions of your protected branch (which plans offer that merge check was not
# verified for this sample). Set RUNWARD_VERSION to the runward version you install; left at
# `latest`, the step warns on every run.
#
# The gate is deterministic and zero-LLM: no secrets, no model key needed.
# Exit codes (the port contract): 0 clean · 1 gaps · 2 no mission, a usage error or a refused gesture: the question could not be asked, never a red gate.
# Not shipped yet: a Code Insights summary poster and an approval reader for Bitbucket (D5).

definitions:
  steps:
    - step: &runward-gate
        name: runward gate
        # The floor runward's own package declares (engines.node, ADR-0070).
        image: node:22
        script:
          - export RUNWARD_VERSION="${RUNWARD_VERSION:-latest}"
          - |
            case "$RUNWARD_VERSION" in
              latest|next) echo "WARNING: runward@$RUNWARD_VERSION is not pinned: the verdict can change when a new runward is published. Pin the RUNWARD_VERSION repository variable for a reproducible verdict." ;;
              *) printf '%s' "$RUNWARD_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "ERROR: invalid runward version '$RUNWARD_VERSION'"; exit 2; } ;;
            esac
          - mkdir -p runward-reports
          - npx --yes "runward@$RUNWARD_VERSION" check --strict --json > runward-reports/check.json || true
          - npx --yes "runward@$RUNWARD_VERSION" report --out runward-reports/delivery-report.html || true
          - npx --yes "runward@$RUNWARD_VERSION" check --strict
        artifacts:
          - runward-reports/**

pipelines:
  pull-requests:
    "**":
      - step: *runward-gate
  branches:
    main:
      - step: *runward-gate
