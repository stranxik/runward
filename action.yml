# runward — the deterministic conformance gate as a GitHub Action (ADR-0028).
# Make it a required status check on your protected branch so no gap merges:
#
#   - uses: stranxik/runward@<sha>          # pin by commit SHA
#     with:
#       path: .                              # dir containing the runward/ mission
#       strict: 'true'                       # verify the rule-conformance manifests
#
# Deterministic, zero-LLM: no secrets, no model key. Exit codes are the port
# contract — 0 clean, 1 gaps, 2 no mission found — so the job fails on a gap.
name: runward gate
description: Deterministic, zero-LLM conformance gate for agentic delivery — runs runward check --strict as a required status check.
author: Thibault Souris
branding:
  icon: shield
  color: gray-dark
inputs:
  path:
    description: Project directory containing the runward/ mission.
    required: false
    default: "."
  strict:
    description: Verify the rule-conformance manifests and their evidence (recommended).
    required: false
    default: "true"
  version:
    description: runward version to run (an npm version or dist-tag).
    required: false
    default: latest
runs:
  using: composite
  steps:
    - shell: bash
      # Inputs are passed through the environment, never interpolated into the run script, so a
      # malicious `version`/`path` (e.g. from a PR title fed into a caller workflow) cannot break
      # out of the quotes and inject shell (CWE-78). The script only reads validated env vars.
      env:
        RUNWARD_VERSION: ${{ inputs.version }}
        RUNWARD_PATH: ${{ inputs.path }}
        RUNWARD_STRICT: ${{ inputs.strict }}
      run: |
        # The gate needs nothing but the repo and Node >= 20 (present on GitHub runners).
        # Validate version against a strict allowlist (semver or a dist-tag) before it reaches npx.
        case "$RUNWARD_VERSION" in
          latest|next) : ;;
          [0-9]*.[0-9]*.[0-9]*) : ;;
          *) echo "::error::invalid runward version '$RUNWARD_VERSION' (use a semver or 'latest')"; exit 2 ;;
        esac
        flag=""
        [ "$RUNWARD_STRICT" = "true" ] && flag="--strict"
        npx --yes "runward@${RUNWARD_VERSION}" check $flag -p "$RUNWARD_PATH"
