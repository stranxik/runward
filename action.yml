# runward — the deterministic conformance gate as a GitHub Action (ADR-0028).
# Make it a required status check on your protected branch so no gap merges:
#
#   - uses: stranxik/runward@<sha>          # pin by commit SHA
#     with:
#       path: .                              # dir containing the runward/ mission
#       strict: 'true'                       # verify the rule-conformance manifests
#       version: 0.45.0                      # pin the version for a reproducible verdict
#       spec: specs/four-eyes/               # optional: also run `runward spec-check` on these
#
# Needs Node >= 22.12 on the runner (the package's `engines`): add actions/setup-node with
# node-version 22 or later before this step if the runner's default Node is older. The step checks
# and stops with exit 2 and a message instead of running an unsupported Node.
#
# Under strict, the step also appends the Markdown summary (`runward report --format md`) to the job
# summary; it never changes the exit code.
#
# Deterministic, zero-LLM: no secrets, no model key. Exit codes are the port
# contract — 0 clean, 1 gaps, 2 no mission, a usage error or a refused gesture
# (the question could not be asked, never a red gate) — so the job fails on a gap.
name: runward gate
description: Deterministic, zero-LLM conformance gate for agentic delivery — runs runward check --strict as a required status check.
author: Thibault Souris
branding:
  icon: shield
  color: gray-dark
inputs:
  path:
    description: Project directory containing the runward/ mission.
    required: false
    default: "."
  strict:
    description: Verify the rule-conformance manifests and their evidence (recommended).
    required: false
    default: "true"
  spec:
    description: Optional. Spec files or bundle directories for `runward spec-check`, one per line (or space-separated), relative to the workspace. Each acceptance criterion must link to a present artifact; it runs after the gate, and either one failing fails the step.
    required: false
    default: ""
  check:
    description: Run the mission gate (`runward check`). Set to 'false' to run only `spec-check` on a repository without a runward/ mission; `spec` is then required.
    required: false
    default: "true"
  version:
    description: runward version to run (an npm version or dist-tag). Pin an exact version for a reproducible verdict; the default follows the latest release and says so on every run.
    required: false
    default: latest
runs:
  using: composite
  steps:
    - shell: bash
      # Inputs are passed through the environment, never interpolated into the run script, so a
      # malicious `version`/`path` (e.g. from a PR title fed into a caller workflow) cannot break
      # out of the quotes and inject shell (CWE-78). The script only reads validated env vars.
      env:
        RUNWARD_VERSION: ${{ inputs.version }}
        RUNWARD_PATH: ${{ inputs.path }}
        RUNWARD_STRICT: ${{ inputs.strict }}
        RUNWARD_SPEC: ${{ inputs.spec }}
        RUNWARD_CHECK: ${{ inputs.check }}
      run: |
        # The gate needs nothing but the repo and Node >= 22.12 (the package's engines field). A
        # runner whose default Node is older gets a named stop, exit 2, not an unsupported run.
        if ! node -e 'const [a, b] = process.versions.node.split(".").map(Number); process.exit(a > 22 || (a === 22 && b >= 12) ? 0 : 1)'; then
          echo "::error::runward needs Node >= 22.12 and this runner has $(node --version 2>/dev/null || echo 'no node'). Add actions/setup-node with node-version 22 or later before this step."
          exit 2
        fi
        # Validate version against a strict allowlist (semver or a dist-tag) before it reaches npx.
        case "$RUNWARD_VERSION" in
          latest|next)
            # The verdict depends on the installed version as well as on the tree (RWD-2026-0075), and
            # docs/compliance/regulated-adoption.md asks for a pinned version. The default stays for
            # convenience; it is no longer silent (RWD-2026-0118).
            echo "::warning::runward@$RUNWARD_VERSION is not pinned: the verdict can change when a new runward is published. Pin it with 'version: <x.y.z>' for a reproducible verdict (docs/compliance/regulated-adoption.md)." ;;
          *)
            # x.y.z exactly: the glob [0-9]*.[0-9]*.[0-9]* also admitted "1.0.0; anything" (quoted, so no
            # injection, but not a version either). Same allowlist as the GitLab template.
            [[ "$RUNWARD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::invalid runward version '$RUNWARD_VERSION' (use a semver or 'latest')"; exit 2; } ;;
        esac
        # The spec paths are read as data: split on newlines and spaces, never evaluated, each one
        # refused if it starts with `-` (it would be read as an option), and passed after `--`.
        specs=()
        while IFS= read -r item; do
          [ -z "$item" ] && continue
          case "$item" in
            -*) echo "::error::invalid spec path '$item' (a path cannot start with '-')"; exit 2 ;;
          esac
          specs+=("$item")
        done < <(printf '%s\n' "$RUNWARD_SPEC" | tr ' \t' '\n\n')
        case "$RUNWARD_CHECK" in
          true|false) : ;;
          *) echo "::error::invalid check input '$RUNWARD_CHECK' (use 'true' or 'false')"; exit 2 ;;
        esac
        if [ "$RUNWARD_CHECK" = "false" ] && [ "${#specs[@]}" -eq 0 ]; then
          echo "::error::check: 'false' runs only spec-check, and no spec was given: nothing to run."
          exit 2
        fi
        status=0
        if [ "$RUNWARD_CHECK" = "true" ]; then
          flag=""
          [ "$RUNWARD_STRICT" = "true" ] && flag="--strict"
          npx --yes "runward@${RUNWARD_VERSION}" check $flag -p "$RUNWARD_PATH" || status=$?
          # The pull request summary (ADR-0093 D1): the neutral Markdown `report --format md` renders,
          # the same bytes runward-forge posts on GitLab, appended to the job summary. Strict only (the
          # summary states the strict verdict), never when the question could not be asked, and never
          # changing the step's exit code: a summary is a convenience, the gate's code is the signal.
          if [ "$status" -ne 2 ] && [ "$RUNWARD_STRICT" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            summary="$(mktemp)"
            if npx --yes "runward@${RUNWARD_VERSION}" report --format md -p "$RUNWARD_PATH" > "$summary"; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::notice::summary not written: runward@$RUNWARD_VERSION did not render report --format md (a runward that ships it is needed)."
            fi
            rm -f "$summary"
          fi
        fi
        if [ "${#specs[@]}" -gt 0 ]; then
          spec_status=0
          npx --yes "runward@${RUNWARD_VERSION}" spec-check -p "$RUNWARD_PATH" -- "${specs[@]}" || spec_status=$?
          # The higher code wins: 2 (the question could not be asked) over 1 (gaps) over 0.
          [ "$spec_status" -gt "$status" ] && status=$spec_status
        fi
        exit $status
