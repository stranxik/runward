version: 2
# Cooldown (ADR-0088 class D, "Dependabot merges (with cooldown)"): a new version is not proposed
# until 7 days after its release. GitHub's options reference: the option is "only available for
# *version* updates, not *security* updates", and without it Dependabot applies "a default cooldown
# period of 3 days". Security updates are not delayed. ADR-0084's auto-merge envelope is unchanged.
updates:
  # CLI dependencies (published package)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    ignore:
      # TypeScript 7 is the new native (Go) compiler. Our tsconfig is already
      # TS-7-ready (types:[node], since it no longer auto-includes @types), but
      # adopting a native-compiler preview on a PUBLISHED package is a deliberate
      # call, not an automated bump. Minor/patch bumps still flow; the major is
      # taken by hand. Re-evaluate when TS 7 is GA-stable. (See CHANGELOG; the
      # forward-compat fix landed in PR #22.)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # Reference floor scaffold (not published, but kept current)
  - package-ecosystem: npm
    directory: "/floor-ts"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(ci)
