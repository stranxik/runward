# The mutation ratchet of ADR-0059: re-derive the survivor register, refuse a stale one.
#
# It reads NO score. A module may sit at 26 % or at 99 % and pass; a survivor list may GROW and pass.
# What fails is a register that has stopped describing the code — a claim nobody re-derived, which is
# the shape ADR-0045 refuses from an operator.
#
# NOT a required check on pull requests, by ADR-0046 decision 3: an instrument that makes every
# change wait gets switched off, and a guard that is switched off guards nothing. It runs when a
# release is published, and on demand.
#
# TWO ROLES, AND THEY MUST NOT SHARE AN EXIT CODE. On a release this is a GATE: a register that has
# stopped describing the code fails the run, and that is the whole point. On a manual dispatch it is
# usually an INSTRUMENT: you run it to LEARN whether the register still holds, on a module nobody has
# instructed yet or after a fix — and there a refusal is the instrument's ANSWER, not a fault in the
# repository. Reporting that answer as a failed run mails the maintainer an alarm for a question they
# asked on purpose. Measured 2026-08-28: of 41 failed runs over eleven days, 32 were this workflow
# and 17 were dispatched on a single afternoon by a campaign doing exactly that. The cost is not the
# noise, it is what noise does to a signal — a maintainer who learns to skip this workflow's mail is
# a maintainer who will skip the one that matters.
#
# So `mode: measure` reports the refusal, in the log and in the job summary, and exits 0. It is an
# explicit choice at dispatch time and it is NEVER the default: the release path never reads the
# input, so the gate keeps failing exactly as before. This is not a bypass — nothing about the
# verdict changes, only whether an answer you asked for is filed as an incident.
#
# WHY THIS IS CHUNKED, measured rather than assumed. The first real run (2026-08-24) was CANCELLED at
# exactly 6 h 00 — the runner's job ceiling — on `evidence` alone. ADR-0059 decision 4 justified a
# per-module matrix ON that ceiling, and the ceiling turned out to sit below one module. So the
# matrix is per module AND per line range, which `scripts/mutation-chunked.sh` already knew how to do
# and this workflow did not use.
name: Mutation ratchet (ADR-0059)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      module:
        description: "One module to check, or blank for the whole perimeter"
        required: false
        type: string
      target_minutes:
        description: "Predicted minutes a chunk may cost (ADR-0104; smaller = more legs, each shorter)"
        required: false
        default: "90"
        type: string
      mode:
        description: "gate = a refusal fails the run · measure = a refusal is the instrument's answer, reported and not failed"
        required: false
        default: gate
        type: choice
        options: [gate, measure]

# One dispatched run at a time: a second dispatch waits for the first instead of doubling the legs
# that hold the account's 20 concurrent jobs (see max-parallel below). The group is per event, so a
# release's gate never waits behind, or is replaced by, a dispatch: GitHub keeps one waiting run per
# group, and a third dispatch replaces the waiting dispatch (a question asked again), never a gate.
concurrency:
  group: mutation-ratchet-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ADR-0110 decision 3: a delegate of runward/delegation.md may dispatch or re-run this workflow only as
  # .github/dispatch-allowlist.json allows: one module, mode measure. An empty module runs the summary job,
  # which signs a ratchet summary (a release's act, ADR-0079); mode gate is a release's verdict. Every
  # other job waits on this one. This holds main's copy only: a branch's copy is not held (the ADR says so).
  refuse-delegate:
    name: A delegate may dispatch only what the closed list allows (ADR-0110)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse a delegate's run outside .github/dispatch-allowlist.json
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          DELEGATES: '["runward-steward[bot]","claude"]'
          EVENT: ${{ github.event_name }}
          MODULE: ${{ inputs.module }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if ! jq -e --arg a "$TRIGGERING_ACTOR" 'any(.[]; . == $a)' <<<"$DELEGATES" >/dev/null; then exit 0; fi
          module="$(printf '%s' "$MODULE" | tr -d '[:space:]')"
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$module" ] && [ "$MODE" = "measure" ]; then exit 0; fi
          echo "::error::$TRIGGERING_ACTOR is a delegate of runward/delegation.md: it may run this workflow only on workflow_dispatch with a non-empty module and mode measure (event=$EVENT module='$MODULE' mode='$MODE'; .github/dispatch-allowlist.json, ADR-0110)"
          exit 1

  # The plan is DERIVED from stryker.config.json and from the built files, never written here. The
  # perimeter is data (ADR-0046), so a module cannot be added to the measurement and left out of the
  # ratchet, or removed from the ratchet while still claiming to be measured.
  #
  # WHERE each module is cut and in WHICH ORDER the legs run is derived too, from measured cost
  # (ADR-0104): docs/compliance/mutation-chunk-costs.json records, per line, what the last
  # whole-perimeter run killed and what survived, and a survivor costs the whole suite where a kill
  # costs the cheap stage. Fixed 60-line ranges in configuration order gave the 0.46.0 run a 4.6 h leg
  # under a 5 h step ceiling and a last wave of long legs with the other slots idle: 13.5 h of wall
  # clock for 11.5 h of work. The planner cuts to a predicted target and sorts longest first. The
  # record never decides WHAT is measured: every line of every module as built, once, whatever it says.
  plan:
    needs: refuse-delegate
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.split.outputs.chunks }}
      modules: ${{ steps.split.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: split
        env:
          ONLY: ${{ inputs.module }}
          TARGET: ${{ inputs.target_minutes || '90' }}
        # Inputs travel through env, never interpolated into the script (CWE-78). The planner writes
        # `chunks=` and `modules=` to $GITHUB_OUTPUT, prints the chunk count, the longest predicted leg
        # and the predicted runner-hours, and warns on a stale record; it refuses (exit 2) an unbuilt
        # module, an empty plan or more legs than a matrix can hold.
        run: |
          if [ -n "$ONLY" ]; then
            node scripts/mutation-plan.mjs --github-output --target "$TARGET" --module "$ONLY"
          else
            node scripts/mutation-plan.mjs --github-output --target "$TARGET"
          fi

      # ADR-0105: the per-file coverage map, built ONCE here on the same commit and Node the legs
      # use, so a surviving mutant runs only the unit test files that execute its lines. It is
      # keyed to the build digest; a leg whose build differs, or a map that failed or is missing,
      # makes scripts/mutation-select-tests.mjs answer ALL and the leg runs the whole suite, as
      # before. Fewer tests can only turn a kill into a survivor, never the reverse, so a wrong
      # map surfaces as a ratchet mismatch, never as a false green.
      - name: Build the coverage map (ADR-0105)
        continue-on-error: true
        run: node scripts/mutation-coverage-map.mjs --out coverage-map.json
      - name: Keep the coverage map
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-map
          path: coverage-map.json
          if-no-files-found: warn
          retention-days: 7

  measure:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 8, and one dispatched run at a time (the workflow's `concurrency`). The account's ceiling on
      # standard runners is 20 concurrent jobs, shared by every repository of the account. 16 assumed
      # one run; measured 2026-11-12, two measuring runs dispatched together held all 20 (13 + 7), and
      # for hours every other repository waited: a deploy of runward-hosted waited 21 min for one job,
      # the hosted-service send of other repositories over 40 min. 8 leaves 12 for everyone else. The
      # price, said plainly: by ADR-0104's measured sum, a whole-perimeter run's floor goes from about
      # 11.4 h at 16 abreast to about 23 h at 8. Above the ceiling legs queue rather than fail.
      max-parallel: 8
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Collect the coverage map (ADR-0105)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-map
          path: .

      # CONCURRENCY IS COMPUTED, not copied. The committed value (2) was measured on an 8-core
      # machine against a suite that uses 3.1 cores — `node --test` parallelises its own files. A
      # standard runner has FOUR cores, where the same arithmetic gives ONE. Oversubscription does
      # not merely slow a pass down: Stryker counts a Timeout as DETECTED, so a starved run is filed
      # as a caught mutant and the score moves in the flattering direction (measured 2026-08-19 and
      # again 2026-08-24, both times upward).
      # The step stops at five hours, an hour under the runner's own ceiling, and that hour is the
      # whole point. When a JOB hits six hours GitHub CANCELS it: `if: always()` does not run, the
      # artifact never uploads, and the log ends mid-sentence. That is what happened on 2026-08-24
      # and again on the v0.36.2 release run, and both times the only thing left was "cancelled".
      # A step that fails at five hours instead hands control back to the job: `continue-on-error`
      # lets the remaining steps run, the upload fails loudly on a missing file, and the ratchet
      # counts a chunk short and REFUSES. Same red, but a red that says which chunk and why.
      - name: Measure ${{ matrix.chunk.module }} lines ${{ matrix.chunk.start }}-${{ matrix.chunk.end }} (${{ matrix.chunk.predicted }} s predicted)
        timeout-minutes: 300
        env:
          RUNWARD_MUTATION_MODULE: ${{ matrix.chunk.module }}
        run: |
          CORES=$(nproc)
          CONC=$(( CORES / 3 ))
          [ "$CONC" -lt 1 ] && CONC=1
          echo "::notice::$CORES cores, suite uses ~3 — concurrency $CONC"
          # ADR-0105: map and this leg's mutant table, absolute paths (Stryker runs the test command
          # inside its sandbox). Either missing: the variables stay empty and the whole suite runs.
          if [ -s coverage-map.json ] && node scripts/mutation-mutant-table.mjs \
               --mutate "${{ matrix.chunk.file }}:${{ matrix.chunk.start }}-${{ matrix.chunk.end }}" \
               --out "$PWD/mutant-table.json"; then
            export RUNWARD_MUTATION_MAP="$PWD/coverage-map.json" RUNWARD_MUTATION_TABLE="$PWD/mutant-table.json"
            echo "::notice::coverage map and mutant table present: survivors run their covering files only"
          else
            echo "::warning::no coverage map or mutant table: this leg runs the whole suite per mutant"
          fi
          npx stryker run \
            --mutate "${{ matrix.chunk.file }}:${{ matrix.chunk.start }}-${{ matrix.chunk.end }}" \
            --concurrency "$CONC" --force
        continue-on-error: true   # a failed chunk must still reach the ratchet, which calls it REFUSED

      # Not optional. Stryker counts a Timeout as DETECTED, and an unverified one hides a survivor:
      # on `evidence` 199 of 269 "timeouts" turned out to be survivors when re-run alone. The ratchet
      # refuses a report that carries timeouts without this stamp.
      - name: Verify every timeout alone
        run: |
          [ -f reports/mutation/mutation.json ] || { echo "no report — the ratchet will refuse"; exit 0; }

          # How many timeouts does this chunk actually carry? A chunk with NONE needs no
          # verification and no stamp — and must still produce the artifact, or a healthy module
          # fails the whole job for being healthy. That is what happened on the first chunked run
          # (2026-08-25, module `paths`): "no Timeout-status mutants to verify", no verified.json,
          # and the ratchet reported "0 of 1 chunks measured". The worst failure mode available —
          # the clean case breaking the chain.
          TIMEOUTS=$(node -e '
            const r = require("./reports/mutation/mutation.json");
            let n = 0;
            for (const f of Object.values(r.files)) for (const m of f.mutants) if (m.status === "Timeout") n++;
            process.stdout.write(String(n));
          ')
          echo "::notice::${{ matrix.chunk.module }} ${{ matrix.chunk.start }}-${{ matrix.chunk.end }}: $TIMEOUTS timeout(s)"

          if [ "$TIMEOUTS" -eq 0 ]; then
            cp reports/mutation/mutation.json reports/mutation/verified.json
            exit 0
          fi

          # With timeouts present the verification is mandatory, and a FAILED verification must not
          # be papered over: no verified.json means the ratchet refuses this chunk, which is the
          # honest outcome. `|| true` here would turn "I could not check" into "checked and fine",
          # the same confusion that produced RWD-2026-0029.
          node scripts/mutation-timeouts.mjs \
            --report reports/mutation/mutation.json \
            --module "${{ matrix.chunk.module }}" \
            --ledger reports/mutation/chunk-timeouts.jsonl || true
          if [ ! -s reports/mutation/chunk-timeouts.jsonl ]; then
            echo "::error::verification produced no verdicts for $TIMEOUTS timeout(s) — this chunk will be refused"
            exit 0
          fi
          node scripts/mutation-apply-verdicts.mjs \
            --report reports/mutation/mutation.json \
            --verdicts reports/mutation/chunk-timeouts.jsonl \
            --out "reports/mutation/verified.json" || true

      - name: Keep this chunk
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # `--` between the module and the offset, because a single dash is ALSO inside module
          # names: `chunk-territory-*` matches `chunk-territory-map-61` and the territory leg then
          # collected ten chunks where the plan asked for seven (RWD-2026-0089).
          name: chunk-${{ matrix.chunk.module }}--${{ matrix.chunk.start }}
          path: reports/mutation/verified.json
          retention-days: 7
          if-no-files-found: error   # a missing chunk must fail loudly here, not silently downstream

  ratchet:
    needs: [plan, measure]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.plan.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Collect this module's chunks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: chunk-${{ matrix.module }}--*
          path: reports/mutation/collected
          merge-multiple: false

      # A chunk that produced nothing is not a chunk that found nothing. The merge counts what it
      # got against what the plan asked for, so an incomplete measurement REFUSES rather than
      # comparing a partial tree against a whole register — the exact shape of a false green.
      - name: Merge and ratchet ${{ matrix.module }}
        env:
          CHUNKS: ${{ needs.plan.outputs.chunks }}
        run: |
          mkdir -p reports/mutation/chunks
          # `find`, not a fixed-depth glob. actions/download-artifact extracts into
          # `<path>/<artifact-name>/` when the pattern matches SEVERAL artifacts, and straight into
          # `<path>/` when it matches exactly one — so a one-chunk module lands a level higher than a
          # many-chunk one. A `collected/*/verified.json` glob therefore worked for every module
          # except the smallest, which is how `paths` reported "0 of 1 chunks measured" twice on
          # 2026-08-25 with the artifact sitting in the workspace the whole time.
          i=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            i=$((i+1))
            cp "$f" "reports/mutation/chunks/${{ matrix.module }}-$(printf '%04d' "$i").json"
          done <<EOF
          $(find reports/mutation/collected -name verified.json -type f 2>/dev/null)
          EOF
          EXPECTED=$(node -e 'const c=JSON.parse(process.env.CHUNKS);process.stdout.write(String(c.filter(x=>x.module==="${{ matrix.module }}").length))')
          echo "::notice::${{ matrix.module }}: $i of $EXPECTED chunk(s) came back"
          if [ "$i" -eq 0 ] || [ "$i" -ne "$EXPECTED" ]; then
            echo "::error title=${{ matrix.module }}::REFUSED — $i of $EXPECTED chunks measured. A partial tree compared against a whole register is a false green, so nothing is compared."
            echo "### ${{ matrix.module }} — REFUSED before comparing" >> "$GITHUB_STEP_SUMMARY"
            echo "$i of $EXPECTED chunk(s) came back." >> "$GITHUB_STEP_SUMMARY"
            # ADR-0079: a refusal is summarised like a pass, so it leaves its answer too.
            printf '{"module":"%s","exit":2,"chunksExpected":%s,"chunksMeasured":%s}\n' "${{ matrix.module }}" "$EXPECTED" "$i" > "reports/mutation/${{ matrix.module }}-answer.json"
            # Same rule as the ratchet's own exit below: on a measurement run the refusal is the
            # answer, reported and not filed as an incident. This path was missed when `mode` was
            # added, which is how a whole-perimeter measurement still came back red.
            if [ "${{ inputs.mode }}" = "measure" ]; then
              echo "::warning title=${{ matrix.module }}::measurement run (mode=measure): refused before comparing. Reported, not failed."
              exit 0
            fi
            exit 2
          fi
          node scripts/mutation-survivors.mjs --chunks "${{ matrix.module }}" \
            --emit-merged "reports/mutation/${{ matrix.module }}-merged.json" >/dev/null
          set +e
          node scripts/mutation-ratchet.mjs --module "${{ matrix.module }}" \
            --report "reports/mutation/${{ matrix.module }}-merged.json"
          CODE=$?
          set -e
          # ADR-0079: the ratchet's answer for this module, kept for the run's signed summary.
          printf '{"module":"%s","exit":%s,"chunksExpected":%s,"chunksMeasured":%s}\n' "${{ matrix.module }}" "$CODE" "$EXPECTED" "$i" > "reports/mutation/${{ matrix.module }}-answer.json"
          case "$CODE" in
            0) echo "::notice title=${{ matrix.module }}::the register describes this tree" ;;
            1) echo "::error title=${{ matrix.module }}::MISMATCH — the register no longer describes this tree. Re-run, instruct what is new, regenerate, commit." ;;
            2) echo "::error title=${{ matrix.module }}::REFUSED — nothing was compared. This is not a passing outcome." ;;
            *) echo "::error title=${{ matrix.module }}::unexpected exit $CODE" ;;
          esac
          # The verdict is written to the job summary either way, so `measure` hides nothing: it
          # changes whether the run is filed as an incident, never what the ratchet decided.
          {
            echo "### ${{ matrix.module }} — ratchet exit $CODE"
            case "$CODE" in
              0) echo "The register describes this tree." ;;
              1) echo "**MISMATCH** — the register no longer describes this tree. Instruct what is new, regenerate, commit." ;;
              *) echo "**REFUSED** — nothing was compared. This is not a passing outcome." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -ne 0 ] && [ "${{ inputs.mode }}" = "measure" ]; then
            echo "::warning title=${{ matrix.module }}::measurement run (mode=measure): the ratchet refused with exit $CODE. Reported, not failed — dispatch with mode=gate to have a refusal fail the run."
            exit 0
          fi
          exit "$CODE"

      - name: Keep the merged evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: merged-${{ matrix.module }}
          path: reports/mutation/${{ matrix.module }}-merged.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Keep this module's answer (ADR-0079)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: answer-${{ matrix.module }}
          path: reports/mutation/${{ matrix.module }}-answer.json
          retention-days: 30
          if-no-files-found: ignore   # a module that crashed before answering is named "no answer" by the summary

  # ADR-0079. The merged reports expire in 30 days and the logs in 90; this job writes the few
  # kilobytes that must outlive them — per module what came back, what the ratchet answered, the
  # survivor counts, the SHA-256 of each merged report, and the verdict, red or green alike — and
  # signs them as a GitHub artifact attestation. It only reads artifacts: no job of this workflow
  # gains write access to the repository or the release, because the jobs above run mutated code
  # for hours (ADR-0049's reason for isolating the build). Whole-perimeter runs only: a single
  # module dispatched for measurement is not a release's ratchet.
  summary:
    needs: [plan, ratchet]
    if: always() && needs.plan.result == 'success' && (github.event_name == 'release' || inputs.module == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # Sigstore signing of the summary happens here, and only here
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Collect the merged reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: merged-*
          path: reports/mutation/merged
      - name: Collect the answers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: answer-*
          path: reports/mutation/answers
      - name: Write the summary
        id: write
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          OUT="ratchet-summary-$VERSION.json"
          node scripts/ratchet-summary.mjs --merged reports/mutation/merged --answers reports/mutation/answers --out "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          { echo "### Ratchet summary (ADR-0079)"; echo; echo '```json'; cat "$OUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the summary
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.write.outputs.file }}
      - name: Keep the summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ratchet-summary
          path: ${{ steps.write.outputs.file }}
          retention-days: 90
          if-no-files-found: error
