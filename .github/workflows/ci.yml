name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Zero-LLM / zero-network gate guard (ADR-0001, ADR-0007)
        run: |
          # Best-effort guard: the core (src/) must not reach the network or a model SDK.
          # It is a guard-rail, not a proof of isolation. child_process is allowed ONLY for
          # local git; the durable guarantee is running the core tests network-isolated.
          fail=0
          # network/runtime modules + HTTP clients + model SDKs
          if grep -rnE "(import[^;]*from|require\() *['\"](node:)?(http|https|net|tls|dns|http2|dgram)['\"]|(import[^;]*from|require\() *['\"](axios|node-fetch|undici|got|ky|superagent|openai|anthropic|cohere-ai|groq-sdk|replicate|ollama|together-ai|@ai-sdk[^'\"]*|@aws-sdk[^'\"]*|@mistralai[^'\"]*|@google/generative-ai|@google-cloud[^'\"]*|@huggingface[^'\"]*)['\"]" src/; then fail=1; fi
          # global network primitives with no import
          if grep -rnE "\b(fetch|XMLHttpRequest|WebSocket|EventSource)[[:space:]]*\(" src/; then fail=1; fi
          # dynamic network import or code eval (escape hatches around the static check)
          if grep -rnE "import\([[:space:]]*['\"](node:)?(http|https|net|tls|dns)|\beval[[:space:]]*\(|new Function[[:space:]]*\(" src/; then fail=1; fi
          # shelling out to network tools via child_process (git is allowed; these are not)
          if grep -rnE "exec[A-Za-z]*[[:space:]]*\([^)]*\b(curl|wget|nc|ncat|ssh|scp|telnet)\b" src/; then fail=1; fi
          if [ "$fail" = 1 ]; then
            echo "::error::network / model SDK / dynamic-network-import / eval / network shell-out in src/ — the core must stay zero-LLM and zero-network (ADR-0001, ADR-0007)"
            exit 1
          fi
          echo "ok: core stays zero-LLM and zero-network (no network, model SDK, dynamic import of network, eval, or network shell-out in src/)"
      - run: npm test
      - name: Self-gate — runward gates runward
        # The repo carries its own mission (runward/): the strict gate must be green on
        # runward itself, with the same typed-pointer, signature and drift checks any
        # operator gets. Dogfooding as a required check, not a claim.
        run: node dist/cli.js check --strict

  floor-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: reference floor tests
        working-directory: floor-ts
        run: |
          npm ci
          npm test

  core-offline:
    name: core tests, network-isolated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Run core tests with no network (structural zero-network guarantee)
        run: |
          # npm ci + build need the network. The core TEST EXECUTION runs inside a
          # network namespace with no external interfaces: any network call by the
          # core fails the job. This turns the zero-network promise into a structural
          # guarantee, not a grep of src/. child_process (local git) still works;
          # only the network is cut.
          sudo unshare -n bash -c '
            set -e
            ip link set lo up 2>/dev/null || true
            if ip route | grep -q "^default"; then
              echo "::error::network isolation not in effect (default route present)"; exit 1
            fi
            node test/smoke.js
            node test/oscal-schema.js
            # the self-gate also runs with the network cut: the strict gate needs nothing but the repo
            node dist/cli.js check --strict
          '
