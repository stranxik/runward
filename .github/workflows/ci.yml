name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Zero-LLM / zero-network gate guard (ADR-0001, ADR-0007)
        run: |
          # Best-effort guard: the core (src/) must not reach the network or a model SDK.
          # It is a guard-rail, not a proof of isolation. child_process is allowed ONLY for
          # local git; the durable guarantee is running the core tests network-isolated.
          fail=0
          # network/runtime modules + HTTP clients + model SDKs
          if grep -rnE "(import[^;]*from|require\() *['\"](node:)?(http|https|net|tls|dns|http2|dgram)['\"]|(import[^;]*from|require\() *['\"](axios|node-fetch|undici|got|ky|superagent|openai|anthropic|cohere-ai|groq-sdk|replicate|ollama|together-ai|@ai-sdk[^'\"]*|@aws-sdk[^'\"]*|@mistralai[^'\"]*|@google/generative-ai|@google-cloud[^'\"]*|@huggingface[^'\"]*)['\"]" src/; then fail=1; fi
          # global network primitives with no import
          if grep -rnE "\b(fetch|XMLHttpRequest|WebSocket|EventSource)[[:space:]]*\(" src/; then fail=1; fi
          # dynamic network import or code eval (escape hatches around the static check)
          if grep -rnE "import\([[:space:]]*['\"](node:)?(http|https|net|tls|dns)|\beval[[:space:]]*\(|new Function[[:space:]]*\(" src/; then fail=1; fi
          # shelling out to network tools via child_process (git is allowed; these are not)
          if grep -rnE "exec[A-Za-z]*[[:space:]]*\([^)]*\b(curl|wget|nc|ncat|ssh|scp|telnet)\b" src/; then fail=1; fi
          if [ "$fail" = 1 ]; then
            echo "::error::network / model SDK / dynamic-network-import / eval / network shell-out in src/ — the core must stay zero-LLM and zero-network (ADR-0001, ADR-0007)"
            exit 1
          fi
          echo "ok: core stays zero-LLM and zero-network (no network, model SDK, dynamic import of network, eval, or network shell-out in src/)"
      - run: npm test
      - name: Self-gate — runward gates runward
        # The repo carries its own mission (runward/): the strict gate must be green on
        # runward itself, with the same typed-pointer, signature and drift checks any
        # operator gets. Dogfooding as a required check, not a claim.
        run: node dist/cli.js check --strict

  verify-action:
    name: the verify Action, on runward's own mission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # The PR-native verify Action, exercised on the repository that ships it: emit the verdict
      # attestation from this tree, then re-derive it. Dogfooding as a required check — the Action
      # cannot rot unnoticed, and the job summary shows a reviewer what a consumer would see.
      - uses: ./verify
        with:
          emit: 'true'
          attestation: verdict.intoto.json

  windows:
    name: same tree, same verdict — on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      # The full suite, on Windows. The code invests in CRLF normalization and case handling
      # (evidence.ts, scaffold-lock.ts) that no CI leg exercised — the 2026-08-14 audit named the
      # gap: "same working tree => same verdict" was proven on Linux only. This leg is the proof,
      # not a smoke: unit suite + smoke + schema checks + the adversarial corpus + the self-gate.
      - run: npm test
      - name: Self-gate on Windows
        run: node dist/cli.js check --strict

  macos-folding:
    name: the case-folding cases, on the only filesystem that folds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # WHY macOS AND NOT ANOTHER LINUX LEG. The ADR-0061 conformance corpus states its filesystem
      # per case, and two of its cases — U+017F onto s, U+1E9E onto ss — need a volume that performs
      # FULL Unicode case folding. APFS does; ext4 is case-sensitive and skips them; NTFS's upcase
      # table does not fold the sharp s and skips them too. So on ubuntu-latest and windows-latest
      # those two cases were ALWAYS skipped, and RWD-2026-0031 and RWD-2026-0035 — two filed
      # defects, one of which re-opened the other — had no CI coverage at all. The corpus surfaced
      # that by NAMING its skips, which is what it was built to do.
      #
      # It runs the corpus and the self-gate, not the whole suite: the other legs already prove the
      # suite on two OS, and what is missing here is exactly the folding volume.
      - run: node test/spelling-conformance.js
      - name: Self-gate on macOS
        run: node dist/cli.js check --strict

  floor-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: reference floor tests
        working-directory: floor-ts
        run: |
          npm ci
          npm test

  # `docs/compliance/regulated-adoption.md` tells a regulated buyer that dependency hygiene "rests on
  # Dependabot and on the maintainer merging it, not on a gate". That sentence was written on
  # 2026-08-06 because it was true: `grep -rn "npm audit" .github/workflows/` returned nothing, and a
  # HIGH advisory had sat green and unmerged while a release was cut. The line the sheet can now
  # carry is the enforced one, which is a different claim from the true one.
  #
  # Scoped to high and critical on purpose. A floor set at `low` reds on advisories nobody would act
  # on, and a guard that cries on the safe case gets switched off — four of them did here this week.
  vulnerabilities:
    name: no high or critical advisory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      - name: npm audit (high and above)
        run: npm audit --audit-level=high

  # The `coverage` script existed since forever and NOTHING called it: measured, never enforced.
  # ADR-0046 refuses a blocking threshold on the MUTATION score, for reasons that do not transfer
  # here — a mutation score is a property of the tests, and a number in a manifest would be a verdict
  # nobody re-derived. Line coverage is a property of the run, recomputed from scratch every time, so
  # a floor is opposable rather than declarative.
  #
  # It is a RATCHET, not a target. The floor sits just under the measured value; raising it is a
  # deliberate commit, and a drop is a red build that names the number. Chasing the floor upward by
  # writing tests that assert nothing is the failure mode, and it is why the floor moves only by hand.
  coverage-floor:
    name: coverage does not go down
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      - name: measure, and refuse a drop
        env:
          # Measured 87.92 % on 2026-08-24. A floor at 78 left ten points of slack: a fifth of the
          # coverage could go before anything reddened, which is a ratchet in name only. Set three
          # points under the measurement — enough for an honest refactor to breathe, not enough for a
          # module to lose its tests unnoticed. Raise it when the measurement moves up, never lower
          # it to make a red build green.
          FLOOR: "85"
        run: |
          set -euo pipefail
          npm run coverage 2>&1 | tee /tmp/cov.txt
          pct=$(grep -E "all files" /tmp/cov.txt | tail -1 | awk -F'|' '{gsub(/ /,"",$2); print $2}')
          echo "line coverage: ${pct}% (floor ${FLOOR}%)"
          awk -v p="$pct" -v f="$FLOOR" 'BEGIN { if (p+0 < f+0) { print "::error::line coverage " p "% fell below the floor of " f "%"; exit 1 } }'

  reproducible-build:
    name: reproducible build (the claim, mechanised)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      # `docs/compliance/regulated-adoption.md` tells a regulated buyer "Deterministic build; anyone
      # can re-verify the published artifact", and until now NOTHING checked it. The claim happened
      # to be true (verified by hand on 2026-08-04), which is worse than false: an unbacked claim
      # that holds is one nobody notices when it stops holding. A reliability dossier flagged it as
      # the exact overclaim this project fails a test over elsewhere.
      - name: Adversarial audit corpus (ADR-0045)
        run: npm run build && node test/audit-corpus.js
      - name: Build and pack twice, compare the bytes
        run: |
          set -euo pipefail
          # `--pack-destination` does not create the directory: without this line npm exits ENOENT
          # on its own output path and the job reds for a reason that has nothing to do with
          # reproducibility. Caught on the first run of this guard, 2026-08-06. A guard that fails
          # for an unrelated reason teaches the reader to ignore it, which is worse than no guard.
          mkdir -p /tmp/p1 /tmp/p2
          rm -rf dist && npm run build
          npm pack --pack-destination /tmp/p1 >/dev/null
          rm -rf dist && npm run build
          npm pack --pack-destination /tmp/p2 >/dev/null
          a=$(shasum -a 256 /tmp/p1/*.tgz | cut -d" " -f1)
          b=$(shasum -a 256 /tmp/p2/*.tgz | cut -d" " -f1)
          echo "pass 1: $a"
          echo "pass 2: $b"
          if [ "$a" != "$b" ]; then
            echo "::error::the published tarball is not byte-identical across two builds — regulated-adoption.md claims it is"
            tar -tzf /tmp/p1/*.tgz | sort > /tmp/l1
            tar -tzf /tmp/p2/*.tgz | sort > /tmp/l2
            diff /tmp/l1 /tmp/l2 || echo "same file list: the difference is timestamps or compression"
            exit 1
          fi
          echo "byte-identical: a third party can rebuild and compare against the published artifact"

  sbom:
    name: SBOM (supply-chain drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A CycloneDX SBOM on every push/PR, not only at release: surfaces a dependency
      # drift between releases. Syft (Go), SHA-pinned, adds no npm dependency to our tree.
      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: cyclonedx-json
          output-file: runward-sbom.cdx.json
          artifact-name: runward-sbom.cdx.json

  core-offline:
    name: core tests, network-isolated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Run core tests with no network (structural zero-network guarantee)
        run: |
          # npm ci + build need the network. The core TEST EXECUTION runs inside a
          # network namespace with no external interfaces: any network call by the
          # core fails the job. This turns the zero-network promise into a structural
          # guarantee, not a grep of src/. child_process (local git) still works;
          # only the network is cut.
          sudo unshare -n bash -c '
            set -e
            ip link set lo up 2>/dev/null || true
            if ip route | grep -q "^default"; then
              echo "::error::network isolation not in effect (default route present)"; exit 1
            fi
            node test/smoke.js
            node test/oscal-schema.js
            # ADR-0055 criterion 1: the attestation validates against the VENDORED in-toto Statement
            # v1 schema, with the network cut — the envelope contract is proven offline.
            node test/intoto-schema.js
            # the self-gate also runs with the network cut: the strict gate needs nothing but the repo
            node dist/cli.js check --strict
            # ADR-0057: the vendored org corpus resolves, reports, and drifts-advisory with the
            # network cut. `update --corpus`, check --strict, rules --json and the drift signal all
            # read only committed bytes — a green run here is a STRUCTURAL proof of the no-fetch
            # invariant (any socket attempt fails the job), not a grep of src/.
            node --test test/unit/corpus-no-fetch.test.js
          '

  oscal-ingest:
    name: OSCAL ingested by a third-party tool (compliance-trestle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # Emit an OSCAL component-definition from the filled reference mission.
      - name: Emit an OSCAL pack
        run: |
          mkdir -p /tmp/oscal && cd /tmp/oscal
          node "$GITHUB_WORKSPACE/dist/cli.js" --yes init --example
          node "$GITHUB_WORKSPACE/dist/cli.js" compliance iso-42001
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Prove the pack loads in a real third-party OSCAL tool (ADR-0031), not only our
      # vendored JSON-schema check. trestle's models are generated from the NIST metaschemas.
      - name: Ingest + validate with IBM compliance-trestle
        run: |
          pip install compliance-trestle==4.2.0
          python "$GITHUB_WORKSPACE/test/oscal-ingest.py" /tmp/oscal/runward/compliance/oscal-component-definition.json
