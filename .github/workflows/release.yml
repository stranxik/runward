name: Release (npm publish with provenance)

# Publishes runward to npm with a signed SLSA provenance attestation.
# Trigger: creating a GitHub Release (the existing release flow). Manual runs
# are allowed for re-publishing a version that failed to reach the registry.
#
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN secret, no credential to
# rotate or leak. npmjs.com is configured to trust this exact workflow file
# (stranxik/runward · release.yml); the npm CLI (>= 11.5.1) exchanges the OIDC
# id-token below for a short-lived publish credential at publish time.
#
# Least privilege: the SBOM is produced by a THIRD-PARTY action, so it runs in a
# separate `sbom` job that holds only `contents: read` — never in the same job as
# the OIDC `id-token: write` scope. The privileged `publish` job downloads that
# SBOM and attests it. The SBOM is deterministic from the committed lockfile, so
# it describes the exact tarball the publish job packs from the same commit.
on:
  release:
    types: [published]
  workflow_dispatch:

# No workflow-level permissions: each job declares exactly what it needs, so the
# unprivileged SBOM job cannot inherit the publish job's OIDC / write scopes.
permissions: {}

jobs:
  # The isolated builder (ADR-0049): the tarball's provenance is signed INSIDE this reusable
  # workflow, so no step of the present file can influence what it attests, and a reader can pin
  # the builder identity with `gh attestation verify --signer-workflow`. Publish stays below,
  # because npm trusted publishing validates the CALLING workflow and npmjs.com trusts this file.
  build:
    name: Build and attest (isolated builder)
    uses: ./.github/workflows/build-and-attest.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  sbom:
    name: Generate SBOM (unprivileged)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # CycloneDX SBOM via Syft (anchore/sbom-action). Runs with contents:read only,
      # so a compromised release of this third-party action cannot reach the OIDC
      # id-token or a write token. artifact-name uploads it for the publish job.
      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: runward-sbom.cdx.json
          artifact-name: runward-sbom.cdx.json
          upload-release-assets: false # this job is contents:read; the privileged publish job attaches the SBOM to the release

  publish:
    name: Verify, cross-check and publish
    needs: [sbom, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOM asset to the GitHub Release
      id-token: write # OIDC: trusted-publishing credential exchange + provenance attestation
      attestations: write # SLSA attestation binding the SBOM to the packed tarball
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Require npm 11.5.1+ (trusted publishing floor)
        run: |
          v=$(npm --version)
          [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -1)" = "11.5.1" ] \
            || { echo "::error::npm $v < 11.5.1 — OIDC trusted publishing needs 11.5.1+"; exit 1; }
          echo "npm $v ok"

      - name: Install dependencies
        run: npm ci

      # Build + unit + smoke + OSCAL schema. `prepublishOnly` re-runs these before
      # the tarball is packed, so a red gate here or there blocks the publish.
      - name: Verify
        run: npm test

      # Supply-chain evidence for regulated adoption (ADR-0031): a CycloneDX SBOM,
      # attested (SLSA) against the EXACT tarball we publish, attached to the Release.
      # We publish the packed tarball itself so "attested == published"; npm --provenance
      # also signs it (Sigstore) — no cosign needed. The SBOM comes from the unprivileged
      # `sbom` job; it is deterministic from the lockfile, so it describes this tarball.
      - name: Download the isolated builder's tarball and provenance bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isolated-build

      # The determinism cross-check ADR-0049 requires BEFORE anything is published: this job packs
      # the same commit on its own and refuses to publish a builder tarball that does not byte-match
      # it. Two jobs, two packs, one commit — a divergence here means the builder built something
      # this workflow cannot vouch for, and nothing ships. This is also the reproducibility re-proof
      # the ADR-0048 preconditions demanded, executed at release time rather than promised.
      - name: Cross-check — the builder's tarball must byte-match a local pack
        env:
          BUILDER_TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          test -s "$BUILDER_TARBALL"
          LOCAL=$(npm pack --silent --pack-destination /tmp)
          A=$(sha256sum "$BUILDER_TARBALL" | cut -d' ' -f1)
          B=$(sha256sum "/tmp/$LOCAL" | cut -d' ' -f1)
          echo "builder: $A"
          echo "local:   $B"
          [ "$A" = "$B" ] || { echo "::error::builder tarball differs from a local pack of the same commit — refusing to publish"; exit 1; }
          echo "TARBALL=$BUILDER_TARBALL" >> "$GITHUB_ENV"

      - name: Download the SBOM generated by the unprivileged job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runward-sbom.cdx.json

      # actions/attest-sbom is deprecated; actions/attest takes sbom-path directly
      # (same inputs, same SBOM-attestation behaviour) — verified against the
      # action.yml of the pinned tag.
      - name: Attest the SBOM against the tarball
        id: sbom_attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ env.TARBALL }}
          sbom-path: runward-sbom.cdx.json

      # Build provenance is attested in the isolated builder (build-and-attest.yml), not here —
      # that is the entire point of ADR-0049: a step added to THIS file cannot influence what the
      # builder signed, and the certificate's signer identity names the builder file, which
      # `gh attestation verify --signer-workflow` pins. The bundle arrives via the artifact
      # hand-off, cross-checked above.

      - name: Publish the attested tarball with provenance (OIDC, no token)
        run: npm publish "$TARBALL" --provenance --access public

      # Until 2026-08-09 the release carried the SBOM and nothing else: not the tarball, not a single
      # attestation. The provenance existed — `npm audit signatures` returns it, and deps.dev shows
      # Google verifying it independently — but it lived on the npm registry, and a GitHub release is
      # where most people look. So OpenSSF Scorecard read the release assets and answered, in these
      # words, "Project has not signed or included provenance with any releases", scoring
      # Signed-Releases 0/10. The project's own public scorecard contradicted its strongest claim.
      #
      # What goes up is the REAL bundle emitted by the attest step, under the `.intoto.jsonl` name the
      # ecosystem reads. The check looks at filenames and does not verify signatures, so putting
      # anything else there — an empty file, a renamed SBOM — would be the hollow proof this project
      # exists to refuse. It is also why the tarball itself is attached: an attestation whose subject
      # the reader cannot fetch from the same place proves nothing they can act on.
      # Two bundles, two names, one rule (ADR-0048): `runward-X.Y.Z.intoto.jsonl` is the SBOM
      # attestation, `runward-X.Y.Z.provenance.intoto.jsonl` is the build provenance. Both suffixes
      # stay `.intoto.jsonl` and neither may be renamed to `.sigstore.json`: Scorecard v5.5.0
      # classes that suffix as a signature (8 points) where `.intoto.jsonl` is provenance (10) —
      # probes/releasesAreSigned/impl.go:43 at tag v5.5.0. The score is a side effect; the point is
      # that a reader can verify offline from the release page alone (docs/verifying-a-release.md).
      - name: Attach the tarball, both attestation bundles and the SBOM to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BUNDLE: ${{ steps.sbom_attestation.outputs.bundle-path }}
          PROV_BUNDLE: provenance-bundle.jsonl
        run: |
          set -euo pipefail
          test -s "$BUNDLE"      # a missing bundle must red the release, never ship a silent gap
          test -s "$PROV_BUNDLE" # same rule for the provenance bundle
          cp "$BUNDLE" "runward-${TAG#v}.intoto.jsonl"
          cp "$PROV_BUNDLE" "runward-${TAG#v}.provenance.intoto.jsonl"
          gh release upload "$TAG" \
            "$TARBALL" \
            "runward-${TAG#v}.intoto.jsonl" \
            "runward-${TAG#v}.provenance.intoto.jsonl" \
            runward-sbom.cdx.json --clobber
