name: Release (npm publish with provenance)

# Publishes runward, and the second package of this repository, runward-forge (ADR-0094, same
# version, same tag), to npm with a signed SLSA provenance attestation, in the two phases ADR-0085
# decides: the workflow PREPARES a draft release, the maintainer PUBLISHES it, and npm receives the
# file the published release holds. The third package, runward-fleet (ADR-0093 D4), the fourth,
# runward-run (ADR-0120), and the fifth, runward-integrations (ADR-0122), are release assets only: each
# is private, and nothing here publishes it to npm.
#
#   Prepare (trigger: a pushed `v*` tag, or `workflow_dispatch` on a tag ref to re-run it).
#     The isolated builder packs and attests the tarball, the runward-forge, runward-fleet,
#     runward-run and runward-integrations tarballs and the qualification kit (ADR-0049, ADR-0087),
#     building in one job and signing in another (ADR-0116); an unprivileged job writes the package's
#     SBOM; an unprivileged `verify` job tests,
#     cross-checks the builder's five tarballs, kit and SBOM against its own packs, build and
#     derivation, runs the kit against the tarball installed offline, and stages the assets; an
#     `attest` job that runs no build step signs the SBOM against the tarball; and a `draft` job
#     holding only `contents: write` creates the DRAFT release and attaches the eleven assets: the
#     tarball, the kit, the three `.intoto.jsonl` bundles, the SBOM, the GitLab CI/CD template pinned
#     to the release (ADR-0094), the runward-forge, runward-fleet, runward-run and runward-integrations
#     tarballs. Nothing is published to npm here. A draft is mutable, so a failed preparation is
#     deleted or re-run (the upload uses --clobber).
#
#   The maintainer's gesture (not a workflow). They check the draft's assets and publish it from
#     their own session (`gh release edit vX.Y.Z --draft=false`, or the web page). GitHub documents
#     that a draft fires no `release` workflow and that publishing it fires `published`, and that an
#     event caused by the GITHUB_TOKEN starts no workflow run: a job publishing the draft with its
#     own token would start neither the npm publish below nor the mutation ratchet. That is why no
#     job of this file ever publishes the release (runward/runbook.md §3).
#
#   Publish (trigger: `release: published`).
#     A `publish` job holding `contents: read` and `id-token: write` downloads the tarball FROM THE
#     RELEASE, verifies it against the isolated builder's signature and the tag's commit, and only
#     then runs `npm publish`; then the same for the runward-forge tarball. What npm serves is the
#     byte-identical file the release holds, for each package.
#
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN secret, no credential to rotate or leak.
# npmjs.com is configured to trust this exact workflow file (stranxik/runward · release.yml), for
# each of the two packages (runward-forge's one-time bootstrap: runward/runbook.md §3.1), and
# npm matches the trust on the workflow filename, not on the event; the npm CLI (>= 11.5.1)
# exchanges the OIDC id-token below for a short-lived publish credential at publish time. So
# `npm publish` stays in THIS file, never in the reusable builder.
#
# Least privilege: the jobs that hold the OIDC `id-token: write` scope (`attest`, `publish`, and the
# builder's own `attest`) check out nothing and run no code of the tree or its dependencies
# (ADR-0116; test/unit/release-signing-isolation.test.js): every job that runs the suite, a pack or a
# script of the tree holds `contents: read` only. The job that writes to the release (`draft`) holds
# no `id-token`, and the jobs that hold `id-token` never write to the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  release:
    types: [published]

# No workflow-level permissions: each job declares exactly what it needs, so the unprivileged SBOM
# job cannot inherit another job's OIDC / write scopes.
permissions: {}

jobs:
  # ADR-0110 decision 3: this workflow is not on .github/dispatch-allowlist.json. A run that a delegate
  # of runward/delegation.md started or re-ran is refused here, and every other job waits on this one.
  # This holds main's copy only: a dispatch on a branch ref runs that branch's copy (the ADR says so).
  refuse-delegate:
    name: A delegate may not run this workflow (ADR-0110)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse a run a delegate triggered
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          DELEGATES: '["runward-steward[bot]","claude"]'
        run: |
          set -euo pipefail
          if jq -e --arg a "$TRIGGERING_ACTOR" 'any(.[]; . == $a)' <<<"$DELEGATES" >/dev/null; then
            echo "::error::$TRIGGERING_ACTOR is a delegate of runward/delegation.md and this workflow is not on .github/dispatch-allowlist.json (ADR-0110)"
            exit 1
          fi

  # ─── Prepare ────────────────────────────────────────────────────────────────────────────────────

  # A dispatch on a branch would skip every job below and end green having prepared nothing. A
  # re-run of the prepare phase is dispatched on the TAG (`gh workflow run release.yml --ref
  # vX.Y.Z`); anything else is refused, loudly.
  refuse-non-tag-dispatch:
    name: A manual run must target a tag
    needs: refuse-delegate
    if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "::error::dispatched on $GITHUB_REF; re-run the prepare phase with --ref vX.Y.Z (runward/runbook.md §3)"
          exit 1

  # The isolated builder (ADR-0049): the tarball's provenance is signed INSIDE this reusable
  # workflow, so no step of the present file can influence what it attests, and a reader can pin
  # the builder identity with `gh attestation verify --signer-workflow`.
  build:
    name: Build and attest (isolated builder)
    needs: refuse-delegate
    if: github.event_name != 'release' && github.ref_type == 'tag'
    uses: ./.github/workflows/build-and-attest.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  # The package's SBOM (ADR-0116, decision 2): written by scripts/package-sbom.mjs from the builder's
  # tarball and this commit's lockfile. It uses Node.js built-ins only, so this job installs nothing and
  # runs no third-party action, and it holds `contents: read` only. It refuses a tarball whose bundle is
  # not the lockfile's runtime tree, so no SBOM is ever written for one.
  sbom:
    name: Write the package SBOM (unprivileged)
    needs: build
    if: github.event_name != 'release' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.sbom.outputs.sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Download the isolated builder's tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: isolated-build

      # The timestamp is the commit's, so the document is a pure function of the tag and the tarball and
      # a reader re-derives it byte for byte (docs/verifying-a-release.md, Step 10).
      - name: Write the SBOM of the tarball the builder packed
        id: sbom
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.build.outputs.tarball_sha256 }}
        run: |
          set -euo pipefail
          [ "$(sha256sum "$TARBALL" | cut -d' ' -f1)" = "$TARBALL_SHA256" ] \
            || { echo "::error::$TARBALL is not the file the isolated builder hashed — refusing to describe it"; exit 1; }
          node scripts/package-sbom.mjs --tarball "$TARBALL" --lock package-lock.json \
            --timestamp "$(git show -s --format=%cI HEAD)" --out runward-sbom.cdx.json
          echo "sha256=$(sha256sum runward-sbom.cdx.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Hand the SBOM to the jobs that cross-check and attest it
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runward-sbom.cdx.json
          path: runward-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  # Everything the release checks before anything is signed or drafted, in a job that holds no signing
  # credential (ADR-0116, decision 3): the suite, the mutation register, the byte-for-byte cross-checks
  # (the five tarballs and the kit), the kit run, the SBOM derived a second time. It ran in the job that signs the SBOM
  # until ADR-0116, with install scripts enabled.
  verify:
    name: Verify, cross-check and stage the release assets (no signing credential)
    needs: [sbom, build]
    if: github.event_name != 'release' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # The tag is what every later step reads (ADR-0085, Decision 1). A tag that does not name the
      # version the commit carries would draft a release whose tarball has another number: refused
      # before anything is built into a release.
      - name: The tag names the version the commit carries
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION=$(node -p 'require("./package.json").version')
          [ "$TAG" = "v$VERSION" ] \
            || { echo "::error::tag $TAG does not match package.json version $VERSION — refusing to prepare a release"; exit 1; }
          echo "tag $TAG matches package.json $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      # Build + unit + smoke + OSCAL schema. `prepublishOnly` re-runs these before the tarball is
      # packed, so a red gate here or there blocks the release.
      - name: Verify
        run: npm test

      # ADR-0103: the mutation register must have been measured on the modules this release packs.
      # The ratchet (mutation-ratchet.yml) starts on `release: published`, with the npm publish, and
      # answers hours later on an immutable release, so it cannot refuse anything (RWD-2026-0183).
      # This step can: it compares each built dist/lib/<module>.js of the perimeter, built by
      # `npm test` above, with the digest of the source its filing was measured on
      # (docs/compliance/mutation-measured-sources.json). Exit 1 (a stale or unknown module) and
      # exit 2 (an input missing) both fail this job, so no draft is created and nothing can be
      # published. To clear it: re-measure the modules it names, file them, record them, re-tag.
      - name: The mutation register was measured on this build (ADR-0103)
        run: node scripts/mutation-fresh.mjs

      # Supply-chain evidence for regulated adoption (ADR-0031): a CycloneDX SBOM, attested (SLSA)
      # against the EXACT tarball that is attached to the release and later published to npm, so
      # "attested == published"; npm --provenance also signs it (Sigstore) — no cosign needed. The
      # SBOM comes from the unprivileged `sbom` job; it is a pure function of the tarball and the
      # lockfile, and this job derives it again below (ADR-0116).
      - name: Download the isolated builder's tarball and provenance bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: isolated-build

      # The determinism cross-check ADR-0049 requires BEFORE anything reaches a release: this job
      # packs the same commit on its own and refuses a builder tarball that does not byte-match it.
      # Two jobs, two packs, one commit — a divergence here means the builder built something this
      # workflow cannot vouch for, and nothing is drafted, so nothing can be published. This is also
      # the reproducibility re-proof the ADR-0048 preconditions demanded, executed at release time
      # rather than promised.
      - name: Cross-check — the builder's tarball must byte-match a local pack
        env:
          BUILDER_TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          test -s "$BUILDER_TARBALL"
          [ "$BUILDER_TARBALL" = "runward-$VERSION.tgz" ] \
            || { echo "::error::builder tarball is $BUILDER_TARBALL, expected runward-$VERSION.tgz — refusing to publish"; exit 1; }
          LOCAL=$(npm pack --silent --pack-destination /tmp)
          A=$(sha256sum "$BUILDER_TARBALL" | cut -d' ' -f1)
          B=$(sha256sum "/tmp/$LOCAL" | cut -d' ' -f1)
          echo "builder: $A"
          echo "local:   $B"
          [ "$A" = "$B" ] || { echo "::error::builder tarball differs from a local pack of the same commit — refusing to publish"; exit 1; }
          echo "TARBALL=$BUILDER_TARBALL" >> "$GITHUB_ENV"

      # ADR-0094: the same cross-check for the runward-forge tarball. The builder packed
      # packages/runward-forge at this commit; this job packs it again and refuses a tarball that
      # differs by one byte, or that does not carry the version runward carries.
      - name: Cross-check — the builder's runward-forge tarball must byte-match a local pack
        env:
          BUILDER_FORGE: ${{ needs.build.outputs.forge }}
        run: |
          set -euo pipefail
          test -s "$BUILDER_FORGE"
          [ "$BUILDER_FORGE" = "runward-forge-$VERSION.tgz" ] \
            || { echo "::error::builder forge tarball is $BUILDER_FORGE, expected runward-forge-$VERSION.tgz — refusing to publish"; exit 1; }
          mkdir -p /tmp/forge-local
          LOCAL=$(cd packages/runward-forge && npm pack --silent --pack-destination /tmp/forge-local)
          A=$(sha256sum "$BUILDER_FORGE" | cut -d' ' -f1)
          B=$(sha256sum "/tmp/forge-local/$LOCAL" | cut -d' ' -f1)
          echo "builder: $A"
          echo "local:   $B"
          [ "$A" = "$B" ] || { echo "::error::builder runward-forge tarball differs from a local pack of the same commit — refusing to publish"; exit 1; }
          echo "FORGE=$BUILDER_FORGE" >> "$GITHUB_ENV"

      # ADR-0093 D4: the same cross-check for the runward-fleet tarball, packed by the builder at this
      # commit, packed again here, refused if it differs by one byte or carries another version.
      - name: Cross-check — the builder's runward-fleet tarball must byte-match a local pack
        env:
          BUILDER_FLEET: ${{ needs.build.outputs.fleet }}
        run: |
          set -euo pipefail
          test -s "$BUILDER_FLEET"
          [ "$BUILDER_FLEET" = "runward-fleet-$VERSION.tgz" ] \
            || { echo "::error::builder fleet tarball is $BUILDER_FLEET, expected runward-fleet-$VERSION.tgz — refusing to publish"; exit 1; }
          mkdir -p /tmp/fleet-local
          LOCAL=$(cd packages/runward-fleet && npm pack --silent --pack-destination /tmp/fleet-local)
          A=$(sha256sum "$BUILDER_FLEET" | cut -d' ' -f1)
          B=$(sha256sum "/tmp/fleet-local/$LOCAL" | cut -d' ' -f1)
          echo "builder: $A"
          echo "local:   $B"
          [ "$A" = "$B" ] || { echo "::error::builder runward-fleet tarball differs from a local pack of the same commit — refusing to publish"; exit 1; }
          echo "FLEET=$BUILDER_FLEET" >> "$GITHUB_ENV"

      # ADR-0120: the same cross-check for the runward-run tarball, packed by the builder at this
      # commit, packed again here, refused if it differs by one byte or carries another version.
      - name: Cross-check — the builder's runward-run tarball must byte-match a local pack
        env:
          BUILDER_RUN: ${{ needs.build.outputs.run }}
        run: |
          set -euo pipefail
          test -s "$BUILDER_RUN"
          [ "$BUILDER_RUN" = "runward-run-$VERSION.tgz" ] \
            || { echo "::error::builder run tarball is $BUILDER_RUN, expected runward-run-$VERSION.tgz — refusing to publish"; exit 1; }
          mkdir -p /tmp/run-local
          LOCAL=$(cd packages/runward-run && npm pack --silent --pack-destination /tmp/run-local)
          A=$(sha256sum "$BUILDER_RUN" | cut -d' ' -f1)
          B=$(sha256sum "/tmp/run-local/$LOCAL" | cut -d' ' -f1)
          echo "builder: $A"
          echo "local:   $B"
          [ "$A" = "$B" ] || { echo "::error::builder runward-run tarball differs from a local pack of the same commit — refusing to publish"; exit 1; }
          echo "RUN=$BUILDER_RUN" >> "$GITHUB_ENV"

      # ADR-0122: the same cross-check for the runward-integrations tarball, packed by the builder at
      # this commit, packed again here, refused if it differs by one byte or carries another version.
      - name: Cross-check — the builder's runward-integrations tarball must byte-match a local pack
        env:
          BUILDER_INTEGRATIONS: ${{ needs.build.outputs.integrations }}
        run: |
          set -euo pipefail
          test -s "$BUILDER_INTEGRATIONS"
          [ "$BUILDER_INTEGRATIONS" = "runward-integrations-$VERSION.tgz" ] \
            || { echo "::error::builder integrations tarball is $BUILDER_INTEGRATIONS, expected runward-integrations-$VERSION.tgz — refusing to publish"; exit 1; }
          mkdir -p /tmp/integrations-local
          LOCAL=$(cd packages/runward-integrations && npm pack --silent --pack-destination /tmp/integrations-local)
          A=$(sha256sum "$BUILDER_INTEGRATIONS" | cut -d' ' -f1)
          B=$(sha256sum "/tmp/integrations-local/$LOCAL" | cut -d' ' -f1)
          echo "builder: $A"
          echo "local:   $B"
          [ "$A" = "$B" ] || { echo "::error::builder runward-integrations tarball differs from a local pack of the same commit — refusing to publish"; exit 1; }
          echo "INTEGRATIONS=$BUILDER_INTEGRATIONS" >> "$GITHUB_ENV"

      # ADR-0087: the same cross-check for the qualification kit. The builder built it from the tag
      # and the tarball above; this job builds it again from the same commit and the same tarball and
      # refuses a kit that differs by one byte. The build is deterministic (sorted entries, the
      # commit's time, no gzip time), so a difference is a divergence, never noise.
      - name: Cross-check — the builder's qualification kit must byte-match a local build
        env:
          BUILDER_KIT: ${{ needs.build.outputs.kit }}
        run: |
          set -euo pipefail
          test -s "$BUILDER_KIT"
          [ "$BUILDER_KIT" = "runward-qualification-kit-$VERSION.tgz" ] \
            || { echo "::error::builder kit is $BUILDER_KIT, expected runward-qualification-kit-$VERSION.tgz — refusing to publish"; exit 1; }
          mkdir -p /tmp/kit-local
          node scripts/build-qualification-kit.mjs --tarball "$TARBALL" --out /tmp/kit-local
          A=$(sha256sum "$BUILDER_KIT" | cut -d' ' -f1)
          B=$(sha256sum "/tmp/kit-local/$BUILDER_KIT" | cut -d' ' -f1)
          echo "builder: $A"
          echo "local:   $B"
          [ "$A" = "$B" ] || { echo "::error::builder kit differs from a local build of the same commit — refusing to publish"; exit 1; }
          echo "KIT=$BUILDER_KIT" >> "$GITHUB_ENV"

      # The kit is run once, here, the way its README tells a user to: against the tarball installed
      # into an empty project. A kit whose own run is red on the release it describes is not attached.
      # The install is offline, with an empty cache: the tarball bundles its runtime dependencies
      # (ADR-0116, decision 1), so one that needs the registry fails here instead of reaching npm.
      - name: Run the qualification kit against the tarball installed offline
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          tar -xzf "$KIT" -C "$WORK"
          mkdir "$WORK/consumer" "$WORK/empty-cache"
          (cd "$WORK/consumer" && npm init -y >/dev/null \
            && npm install --offline --cache "$WORK/empty-cache" --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE/$TARBALL")
          node "$WORK/runward-qualification-kit-$VERSION/run.mjs" \
            --package "$WORK/consumer/node_modules/runward" --out "$WORK/report"

      - name: Download the SBOM generated by the unprivileged job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runward-sbom.cdx.json

      # ADR-0116: the SBOM is a pure function of the commit and the tarball, so this job derives it
      # again and refuses one that differs by a byte, as it refuses a tarball or a kit.
      - name: Cross-check — the SBOM must byte-match a local derivation
        run: |
          set -euo pipefail
          mkdir -p /tmp/sbom-local
          node scripts/package-sbom.mjs --tarball "$TARBALL" --lock package-lock.json \
            --timestamp "$(git show -s --format=%cI HEAD)" --out /tmp/sbom-local/runward-sbom.cdx.json
          A=$(sha256sum runward-sbom.cdx.json | cut -d' ' -f1)
          B=$(sha256sum /tmp/sbom-local/runward-sbom.cdx.json | cut -d' ' -f1)
          echo "sbom job: $A"
          echo "local:    $B"
          [ "$A" = "$B" ] || { echo "::error::the SBOM differs from a local derivation of the same commit and tarball — refusing to publish"; exit 1; }

      # Two bundles, two names, one rule (ADR-0048): `runward-X.Y.Z.intoto.jsonl` is the SBOM
      # attestation, `runward-X.Y.Z.provenance.intoto.jsonl` is the build provenance. Both suffixes
      # stay `.intoto.jsonl` and neither may be renamed to `.sigstore.json`: Scorecard v5.5.0
      # classes that suffix as a signature (8 points) where `.intoto.jsonl` is provenance (10) —
      # probes/releasesAreSigned/impl.go:43 at tag v5.5.0. The score is a side effect; the point is
      # that a reader can verify offline from the release page alone (docs/verifying-a-release.md).
      # The SBOM attestation is signed by the `attest` job below and joins the others in the `draft` job.
      # ADR-0094 question 2 (a): the GitLab CI/CD template, its `version` input pinned to this release,
      # is the seventh asset, so a GitLab project can `include: remote` it with `integrity:`. It is a
      # pure function of the tagged template and the version (scripts/gitlab-template-asset.mjs), so a
      # reader re-derives its bytes from the tag instead of trusting this page.
      # ADR-0094 question 1: the runward-forge tarball, cross-checked above, is the eighth. Its build
      # provenance lives in GitHub's attestation store (online verification, docs/verifying-a-release.md
      # Step 9); it carries no SBOM attestation, having no dependency to describe.
      # ADR-0093 D4: the runward-fleet tarball, cross-checked above, is the ninth, and the only way it
      # is distributed besides the fleet Action: never published to npm (the package is private).
      # ADR-0120: the runward-run tarball, cross-checked above, is the tenth: private on npm until the
      # bootstrap runward-forge waits on (RWD-2026-0195), so the release asset is how it is distributed.
      # ADR-0122: the runward-integrations tarball, cross-checked above, is the eleventh, and the only
      # file of it a release holds: never published to npm (the package is private); its recipes are
      # taken from a commit of this repository.
      - name: Stage the release assets under their published names, the SBOM attestation aside
        env:
          PROV_BUNDLE: provenance-bundle.jsonl
          KIT_BUNDLE: kit-provenance-bundle.jsonl
        run: |
          set -euo pipefail
          test -s "$PROV_BUNDLE" # a missing bundle must red the release, never ship a silent gap
          test -s "$KIT_BUNDLE"  # and the same for the kit's
          mkdir -p release-assets
          cp "$TARBALL" "release-assets/runward-$VERSION.tgz"
          cp "$PROV_BUNDLE" "release-assets/runward-$VERSION.provenance.intoto.jsonl"
          cp runward-sbom.cdx.json release-assets/runward-sbom.cdx.json
          cp "$KIT" "release-assets/runward-qualification-kit-$VERSION.tgz"
          cp "$KIT_BUNDLE" "release-assets/runward-qualification-kit-$VERSION.provenance.intoto.jsonl"
          node scripts/gitlab-template-asset.mjs --version "$VERSION" --out release-assets
          test -s "release-assets/runward-gitlab-gate-$VERSION.yml"
          cp "$FORGE" "release-assets/runward-forge-$VERSION.tgz"
          cp "$FLEET" "release-assets/runward-fleet-$VERSION.tgz"
          cp "$RUN" "release-assets/runward-run-$VERSION.tgz"
          cp "$INTEGRATIONS" "release-assets/runward-integrations-$VERSION.tgz"
          sha256sum release-assets/*

      - name: Hand the staged assets to the draft job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  # The SBOM attestation, signed in a job that runs no build step (ADR-0116, decision 3): it checks
  # out nothing and runs no npm, downloads the builder's tarball and the `sbom` job's document, refuses
  # either if its digest is not the one the job that produced it declared, and signs.
  attest:
    name: Attest the SBOM against the tarball (signs, builds nothing)
    needs: [build, sbom, verify]
    if: github.event_name != 'release' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read # what the attestation action reads of the repository; no step here checks it out
      id-token: write # Sigstore signing of the SBOM attestation
      attestations: write # SLSA attestation binding the SBOM to the packed tarball
    steps:
      - name: Download the isolated builder's tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: isolated-build

      - name: Download the SBOM the unprivileged job wrote
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runward-sbom.cdx.json

      - name: The tarball and the SBOM are the files their jobs hashed
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.build.outputs.tarball_sha256 }}
          SBOM_SHA256: ${{ needs.sbom.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$TARBALL" =~ ^runward-[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?\.tgz$ ]] \
            || { echo "::error::the builder declared the tarball '$TARBALL', not runward-X.Y.Z.tgz — refusing to sign"; exit 1; }
          A=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          B=$(sha256sum runward-sbom.cdx.json | cut -d' ' -f1)
          [ "$A" = "$TARBALL_SHA256" ] || { echo "::error::$TARBALL hashes to $A, the builder declared $TARBALL_SHA256 — refusing to sign"; exit 1; }
          [ "$B" = "$SBOM_SHA256" ] || { echo "::error::the SBOM hashes to $B, the sbom job declared $SBOM_SHA256 — refusing to sign"; exit 1; }
          echo "tarball $A, sbom $B: the files their jobs declared"

      # actions/attest-sbom is deprecated; actions/attest takes sbom-path directly
      # (same inputs, same SBOM-attestation behaviour) — verified against the
      # action.yml of the pinned tag.
      - name: Attest the SBOM against the tarball
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ needs.build.outputs.tarball }}
          sbom-path: runward-sbom.cdx.json

      # Build provenance is attested in the isolated builder (build-and-attest.yml), not here —
      # that is the entire point of ADR-0049: a step added to THIS file cannot influence what the
      # builder signed, and the certificate's signer identity names the builder file, which
      # `gh attestation verify --signer-workflow` pins. The bundle arrives via the artifact
      # hand-off, cross-checked above.
      - name: Stage the SBOM attestation under its published name
        env:
          BUNDLE: ${{ steps.sbom_attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE" # a missing bundle must red the release, never ship a silent gap
          mkdir -p sbom-attestation
          cp "$BUNDLE" "sbom-attestation/runward-${GITHUB_REF_NAME#v}.intoto.jsonl"

      - name: Hand the SBOM attestation to the draft job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-attestation
          path: sbom-attestation/
          if-no-files-found: error
          retention-days: 7

  # Until 2026-08-09 the release carried the SBOM and nothing else: not the tarball, not a single
  # attestation. The provenance existed — `npm audit signatures` returns it, and deps.dev shows
  # Google verifying it independently — but it lived on the npm registry, and a GitHub release is
  # where most people look. So OpenSSF Scorecard read the release assets and answered, in these
  # words, "Project has not signed or included provenance with any releases", scoring
  # Signed-Releases 0/10. The project's own public scorecard contradicted its strongest claim.
  #
  # What goes up is the REAL bundle emitted by the attest steps, under the `.intoto.jsonl` name the
  # ecosystem reads. The check looks at filenames and does not verify signatures, so putting
  # anything else there — an empty file, a renamed SBOM — would be the hollow proof this project
  # exists to refuse. It is also why the tarball itself is attached: an attestation whose subject
  # the reader cannot fetch from the same place proves nothing they can act on.
  #
  # ADR-0085: the assets go to a DRAFT, before publication, because an immutable release refuses any
  # change to its assets once published. This job holds `contents: write` and nothing else, and it
  # never publishes the release: that gesture is the maintainer's.
  #
  # ADR-0116: it waits on every job that produced an asset, assembles the eleven (the `verify` job's
  # and the `attest` job's SBOM attestation), and refuses a tarball or an SBOM whose digest is not the
  # one the job that produced it declared: the `verify` job ran every development dependency, so what
  # it staged is checked here, not trusted.
  draft:
    name: Attach the assets to a draft release
    needs: [build, sbom, verify, attest]
    if: github.event_name != 'release' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload its assets
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the assets the verify job staged
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Download the SBOM attestation the attest job signed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-attestation
          path: release-assets

      - name: The staged tarball and SBOM are the files their jobs declared
        env:
          TARBALL_SHA256: ${{ needs.build.outputs.tarball_sha256 }}
          SBOM_SHA256: ${{ needs.sbom.outputs.sha256 }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          A=$(sha256sum "release-assets/runward-$VERSION.tgz" | cut -d' ' -f1)
          B=$(sha256sum release-assets/runward-sbom.cdx.json | cut -d' ' -f1)
          [ "$A" = "$TARBALL_SHA256" ] || { echo "::error::the staged tarball hashes to $A, the builder declared $TARBALL_SHA256 — refusing to draft"; exit 1; }
          [ "$B" = "$SBOM_SHA256" ] || { echo "::error::the staged SBOM hashes to $B, the sbom job declared $SBOM_SHA256 — refusing to draft"; exit 1; }

      # Idempotent on a re-run: a draft that already exists is refilled with --clobber (a draft is
      # mutable). A release that is already PUBLISHED is never written to by a prepare run: on a
      # mutable release that would silently swap what readers already downloaded, and on an
      # immutable one GitHub refuses it anyway.
      - name: Create the draft (or reuse it) and upload the assets
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          cd release-assets
          ASSETS=("runward-$VERSION.tgz" "runward-$VERSION.intoto.jsonl" "runward-$VERSION.provenance.intoto.jsonl" "runward-sbom.cdx.json"
            "runward-qualification-kit-$VERSION.tgz" "runward-qualification-kit-$VERSION.provenance.intoto.jsonl"
            "runward-gitlab-gate-$VERSION.yml" "runward-forge-$VERSION.tgz" "runward-fleet-$VERSION.tgz" "runward-run-$VERSION.tgz"
            "runward-integrations-$VERSION.tgz")
          for f in "${ASSETS[@]}"; do
            test -s "$f" || { echo "::error::$f is missing or empty — refusing to draft a release without it"; exit 1; }
          done
          if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::release $TAG is already published; a prepare run never writes to a published release"
              exit 1
            fi
            echo "draft $TAG exists; its assets are replaced (--clobber)"
          else
            # --verify-tag: the draft is attached to the tag the maintainer pushed, and aborts if it
            # does not exist — nothing derives the commit from a branch at a later time.
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes "Draft prepared by the release workflow. The maintainer checks the assets, writes these notes and publishes it (runward/runbook.md §3)."
          fi
          gh release upload "$TAG" "${ASSETS[@]}" --clobber

      # Read back what the draft holds, by digest, against what this run staged: an upload that
      # reported success is not the same as a draft that carries these bytes.
      - name: Read the draft back, digest by digest
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          cd release-assets
          ID=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          gh api "repos/$GH_REPO/releases/$ID" --jq '.assets[] | "\(.name) \(.digest)"' | sort > held.txt
          for f in "runward-$VERSION.tgz" "runward-$VERSION.intoto.jsonl" "runward-$VERSION.provenance.intoto.jsonl" "runward-sbom.cdx.json" \
            "runward-qualification-kit-$VERSION.tgz" "runward-qualification-kit-$VERSION.provenance.intoto.jsonl" \
            "runward-gitlab-gate-$VERSION.yml" "runward-forge-$VERSION.tgz" "runward-fleet-$VERSION.tgz" "runward-run-$VERSION.tgz" \
            "runward-integrations-$VERSION.tgz"; do
            echo "$f sha256:$(sha256sum "$f" | cut -d' ' -f1)"
          done | sort > staged.txt
          cat held.txt
          diff staged.txt held.txt \
            || { echo "::error::the draft does not hold exactly the eleven staged assets"; exit 1; }
          echo "::notice::draft $TAG holds the eleven assets; the maintainer checks them and publishes it (runbook §3)"

  # ─── Publish ────────────────────────────────────────────────────────────────────────────────────

  # Runs on `release: published`, which the maintainer's own gesture fires. It downloads the tarball
  # FROM THE RELEASE and verifies it before anything else, so npm receives the file the release holds,
  # checked against its signature — not a second pack; then the same for runward-forge. It never
  # writes to the release (contents: read). A failed npm publish is re-run by re-running this job:
  # the release is not touched, and a version npm already holds with the same integrity is skipped.
  publish:
    name: Verify the released tarballs and publish them to npm
    needs: refuse-delegate
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # ADR-0110 decision 1: the publish credential lives behind the `release` environment, whose deployment
    # rule admits only tags `v*`. A run on a branch ref, whatever its workflow file says, cannot enter it,
    # and npm's trusted publishers bound to this environment refuse its OIDC exchange.
    environment: release
    permissions:
      contents: read # download the release asset
      id-token: write # OIDC: trusted-publishing credential exchange + npm provenance
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Require npm 11.5.1+ (trusted publishing floor)
        run: |
          v=$(npm --version)
          [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -1)" = "11.5.1" ] \
            || { echo "::error::npm $v < 11.5.1 — OIDC trusted publishing needs 11.5.1+"; exit 1; }
          echo "npm $v ok"

      # The released tarball must carry the package and the version its tag names.
      - name: Download the tarball the release holds, and check its name and version
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]] \
            || { echo "::error::release tag $TAG is not vX.Y.Z — refusing to publish"; exit 1; }
          VERSION="${TAG#v}"
          TARBALL="runward-$VERSION.tgz"
          gh release download "$TAG" --pattern "$TARBALL"
          test -s "$TARBALL" || { echo "::error::release $TAG holds no $TARBALL — refusing to publish"; exit 1; }
          read -r NAME PKGVERSION < <(tar -xOzf "$TARBALL" package/package.json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);console.log(p.name,p.version)})')
          [ "$NAME" = "runward" ] && [ "$PKGVERSION" = "$VERSION" ] \
            || { echo "::error::$TARBALL holds $NAME@$PKGVERSION, not runward@$VERSION — refusing to publish"; exit 1; }
          echo "sha256: $(sha256sum "$TARBALL" | cut -d' ' -f1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      # The tarball must have been attested by the isolated builder (ADR-0049), from the tag this
      # release names, at the commit that tag points to. GITHUB_SHA on a release event is the tag's
      # commit; it is read again through the API so both agree, and the provenance must name it.
      - name: Verify the build provenance — isolated builder, this tag, this commit
        run: |
          set -euo pipefail
          TAG_COMMIT=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          [ "$TAG_COMMIT" = "$GITHUB_SHA" ] \
            || { echo "::error::tag $TAG resolves to $TAG_COMMIT, the event names $GITHUB_SHA — refusing to publish"; exit 1; }
          NAMED=$(gh attestation verify "$TARBALL" --repo "$GH_REPO" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --signer-workflow "$GH_REPO/.github/workflows/build-and-attest.yml" \
            --source-ref "refs/tags/$TAG" --source-digest "$TAG_COMMIT" \
            --format json --jq '[.[].verificationResult.signature.certificate.sourceRepositoryDigest] | unique | join(" ")')
          echo "tag commit:            $TAG_COMMIT"
          echo "provenance names:      $NAMED"
          [ "$NAMED" = "$TAG_COMMIT" ] \
            || { echo "::error::the provenance names $NAMED, not the tag's commit $TAG_COMMIT — refusing to publish"; exit 1; }
          echo "TAG_COMMIT=$TAG_COMMIT" >> "$GITHUB_ENV"

      - name: Verify the SBOM attestation — this workflow, this commit
        run: |
          gh attestation verify "$TARBALL" --repo "$GH_REPO" \
            --predicate-type https://cyclonedx.org/bom \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
            --source-digest "$TAG_COMMIT"

      # ADR-0085, Decision 4: once immutability is on, the release's own attestation is checked too.
      # Guarded, never failing the chain while the setting is off: releases published before the
      # setting stay mutable and carry no release attestation, so `gh release verify` fails on them
      # by design. The guard reads the release's own `immutable` field, not the repository setting:
      # `GET /repos/{owner}/{repo}/immutable-releases` requires admin read access, which a workflow
      # token never holds (the same reason runbook §3 step 2 reads the settings by hand).
      - name: Verify the release attestation (immutable releases only)
        run: |
          set -euo pipefail
          IMMUTABLE=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.immutable')
          if [ "$IMMUTABLE" = "true" ]; then
            gh release verify "$TAG"
            gh release verify-asset "$TAG" "$TARBALL"
          else
            echo "::notice::release $TAG reports immutable=$IMMUTABLE: no release attestation to verify; skipped, and said so (ADR-0085)"
          fi

      # Idempotent on a re-run, and only on one: npm refuses to publish a version twice, so a re-run
      # after runward went up and runward-forge failed would stop here. The registry is asked what it
      # holds at this version: nothing, and the file is published; the file's own integrity
      # (sha512, the value npm records), and the step says it is already published and goes on; any
      # other value, and the job fails: npm serves a file this release does not hold.
      - name: Publish the released tarball with provenance (OIDC, no token)
        run: |
          set -euo pipefail
          OWN="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
          HELD=$(npm view "runward@$VERSION" dist.integrity 2>/dev/null || true)
          if [ -z "$HELD" ]; then
            npm publish "$TARBALL" --provenance --access public
          elif [ "$HELD" = "$OWN" ]; then
            echo "::notice::runward@$VERSION is already published with this file's integrity ($OWN); not published again"
          else
            echo "::error::npm already holds runward@$VERSION with integrity $HELD, not this release's $OWN"
            exit 1
          fi

      # ─── runward-forge (ADR-0094, question 1): the second package, same version, same tag ────────
      # Runs only once runward is published, and checks its tarball the way runward's was checked:
      # from the release, its name and version, the isolated builder's provenance at the tag's commit,
      # the release attestation when the release is immutable. A failure here reddens the job and
      # leaves runward published: nothing is ever unpublished, and the re-run of this job skips
      # runward (its integrity is already on npm) and retries runward-forge. One case is not a
      # failure: the package's absence from npm, which the publish step reports as a warning.
      - name: Download the runward-forge tarball the release holds, and check its name and version
        run: |
          set -euo pipefail
          FORGE="runward-forge-$VERSION.tgz"
          gh release download "$TAG" --pattern "$FORGE"
          test -s "$FORGE" || { echo "::error::release $TAG holds no $FORGE — runward is published, runward-forge is not"; exit 1; }
          read -r NAME PKGVERSION < <(tar -xOzf "$FORGE" package/package.json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);console.log(p.name,p.version)})')
          [ "$NAME" = "runward-forge" ] && [ "$PKGVERSION" = "$VERSION" ] \
            || { echo "::error::$FORGE holds $NAME@$PKGVERSION, not runward-forge@$VERSION — refusing to publish it"; exit 1; }
          echo "sha256: $(sha256sum "$FORGE" | cut -d' ' -f1)"
          echo "FORGE=$FORGE" >> "$GITHUB_ENV"

      - name: Verify the runward-forge build provenance — isolated builder, this tag, this commit
        run: |
          set -euo pipefail
          NAMED=$(gh attestation verify "$FORGE" --repo "$GH_REPO" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --signer-workflow "$GH_REPO/.github/workflows/build-and-attest.yml" \
            --source-ref "refs/tags/$TAG" --source-digest "$TAG_COMMIT" \
            --format json --jq '[.[].verificationResult.signature.certificate.sourceRepositoryDigest] | unique | join(" ")')
          echo "tag commit:            $TAG_COMMIT"
          echo "provenance names:      $NAMED"
          [ "$NAMED" = "$TAG_COMMIT" ] \
            || { echo "::error::the runward-forge provenance names $NAMED, not the tag's commit $TAG_COMMIT — refusing to publish it"; exit 1; }

      - name: Verify the runward-forge release attestation (immutable releases only)
        run: |
          set -euo pipefail
          IMMUTABLE=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.immutable')
          if [ "$IMMUTABLE" = "true" ]; then
            gh release verify-asset "$TAG" "$FORGE"
          else
            echo "::notice::release $TAG reports immutable=$IMMUTABLE: no release attestation to verify; skipped, and said so (ADR-0085)"
          fi

      # ADR-0116, decision 4. npm trusts this workflow for a package only once the package exists, and
      # runward-forge does not exist until the one-time bootstrap of runward/runbook.md §3.1: from 0.44.0
      # to 0.46.0 this step failed on `404 Not Found - PUT https://registry.npmjs.org/runward-forge`, the
      # job was red, and verify-release.yml, which runs only after a green publish, never ran. The
      # registry's package document tells the cases apart (a version query cannot: `npm view` exits 1
      # with E404 for a missing version of an existing package too). 404: the package has never been
      # published; runward is published above and the runward-forge tarball, verified above, stays on
      # the release, so the step warns, writes it in the job summary and ends green. 200: the publish
      # below, whose failure stays a failure. Anything else: a failure.
      - name: Publish the released runward-forge tarball with provenance (OIDC, no token)
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 -H 'Accept: application/vnd.npm.install-v1+json' \
            "https://registry.npmjs.org/runward-forge") || CODE="unreachable"
          if [ "$CODE" = "404" ]; then
            MSG="runward-forge is not on npm: the package has never been published, so npm trusts no workflow for it yet (one-time bootstrap, runward/runbook.md §3.1). runward@$VERSION is published; runward-forge@$VERSION is not, and its tarball, verified above, stays on the release."
            echo "::warning title=runward-forge not published::$MSG"
            { echo "### runward-forge not published"; echo; echo "$MSG"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$CODE" = "200" ] \
            || { echo "::error::the npm registry answered $CODE for runward-forge; refusing to guess whether the package exists"; exit 1; }
          OWN="sha512-$(openssl dgst -sha512 -binary "$FORGE" | base64 -w0)"
          HELD=$(npm view "runward-forge@$VERSION" dist.integrity 2>/dev/null || true)
          if [ -z "$HELD" ]; then
            npm publish "$FORGE" --provenance --access public
          elif [ "$HELD" = "$OWN" ]; then
            echo "::notice::runward-forge@$VERSION is already published with this file's integrity ($OWN); not published again"
          else
            echo "::error::npm already holds runward-forge@$VERSION with integrity $HELD, not this release's $OWN"
            exit 1
          fi
