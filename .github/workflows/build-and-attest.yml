name: Build and attest (isolated builder)

# The reusable builder ADR-0049 introduces. GitHub's documentation states: "Reusable workflows can
# provide isolation between the build process and the calling workflow, to meet SLSA v1.0 Build
# Level 3." (docs.github.com/en/actions/concepts/security/artifact-attestations, read 2026-08-11.)
# runward asserts no level anywhere — the quoted sentence is the ceiling, frozen verbatim in
# test/unit/no-overclaim.test.js — but the property behind it is real and a reader can DEMAND it:
#
#   gh attestation verify runward-X.Y.Z.tgz --repo stranxik/runward \
#     --signer-workflow stranxik/runward/.github/workflows/build-and-attest.yml
#
# (and the same for runward-forge-X.Y.Z.tgz and the qualification kit, attested here too).
#
# What the isolation buys, concretely: the provenance for the tarball is SIGNED HERE, in a workflow
# whose steps the calling workflow cannot reach into. A step added to release.yml — the file the
# release event runs, the one an attacker editing the caller would touch — can no longer influence
# what this builder attests, and the signer identity in the certificate names THIS file, which is
# what --signer-workflow pins.
#
# Two jobs, so that the build never holds the signing credential (ADR-0116, decision 3). SLSA's Build
# track: "Such secret material MUST NOT be accessible to the environment running the user-defined build
# steps." (slsa.dev/spec/v1.2/build-requirements, read 2026-11-05.) Until ADR-0116 one job held
# `id-token: write` and ran `npm ci` with install scripts, the whole suite and `npm pack`, so any
# development dependency could have asked for the OIDC token and signed under this file's name. Now:
#
#   build   holds `contents: read` and nothing else. It installs without install scripts, tests, packs
#           both tarballs, builds the kit, and declares the SHA-256 of the three files as job outputs.
#   attest  holds `id-token: write` and `attestations: write`. It checks out nothing and runs no npm and
#           no file of the tree: it downloads the three files, refuses any whose digest or name is not
#           the one the build job declared, signs the three provenances and hands them on.
#
# Neither job restores a cache: a cache is the channel through which one run reaches another, and
# test/unit/release-signing-isolation.test.js refuses one anywhere in the release chain.
#
# What stays in the caller, and why: `npm publish` remains in release.yml because npm trusted
# publishing validates the CALLING workflow when a reusable workflow is involved
# (docs.npmjs.com/trusted-publishers) and npmjs.com is configured to trust release.yml. The caller
# also re-runs the full test suite and refuses to publish a tarball that does not byte-match its
# own pack of the same commit — so this builder never becomes a single point of silent divergence.
on:
  workflow_call:
    outputs:
      tarball:
        description: "Filename of the packed tarball"
        value: ${{ jobs.build.outputs.tarball }}
      tarball_sha256:
        description: "SHA-256 of the packed tarball, as the build job hashed it and the signing job checked it"
        value: ${{ jobs.build.outputs.tarball_sha256 }}
      kit:
        description: "Filename of the qualification kit built from the same tree and tarball"
        value: ${{ jobs.build.outputs.kit }}
      forge:
        description: "Filename of the packed runward-forge tarball (packages/runward-forge, same version)"
        value: ${{ jobs.build.outputs.forge }}

permissions: {}

jobs:
  build:
    name: Build, test and pack (no signing credential)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      kit: ${{ steps.kit.outputs.kit }}
      forge: ${{ steps.forge_pack.outputs.forge }}
      tarball_sha256: ${{ steps.digests.outputs.tarball_sha256 }}
      kit_sha256: ${{ steps.digests.outputs.kit_sha256 }}
      forge_sha256: ${{ steps.digests.outputs.forge_sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # No install script runs: none of the lockfile's packages declares one today, and one that
      # appears later would run here, in the job that packs what users install, before any test.
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      # Build + unit + smoke + OSCAL schema — the same net the caller runs. Duplicated on purpose:
      # the builder must not attest a tarball it has not seen pass, and the caller must not publish
      # one it has not seen pass. Two nets, two jobs, one commit.
      - name: Verify
        run: npm test

      # The tarball carries its runtime dependencies (`bundleDependencies`, ADR-0116 decision 1): npm
      # packs them from the tree `npm ci` installed from the lockfile, the tree the suite just ran on.
      - name: Pack the tarball
        id: pack
        run: echo "tarball=$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      # The bundle must be the lockfile's runtime tree at the lockfile's versions; the package SBOM
      # refuses any other (exit 1), here before anything is signed, and again in the release workflow.
      - name: The tarball bundles the tree the suite ran on
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/package-sbom.mjs --tarball "$TARBALL" --lock package-lock.json --out "$RUNNER_TEMP/bundle-check.cdx.json"

      # The second package of this repository (ADR-0094, question 1): runward-forge, released at the
      # SAME version as runward, from the same tag (test/unit/forge-release.test.js refuses a version
      # that differs, and `npm test` above ran it). Packed here, like runward's tarball, and attested by
      # the signing job below, so the signer identity names this file for it too and `--signer-workflow`
      # pins it. `npm pack` is run in the package's own directory: what it packs is that directory's
      # `files`, nothing of the root, and the caller packs it again and refuses a tarball that differs
      # by one byte.
      - name: Pack the runward-forge tarball
        id: forge_pack
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          FORGE=$(cd packages/runward-forge && npm pack --silent --pack-destination "$GITHUB_WORKSPACE")
          [ "$FORGE" = "runward-forge-$VERSION.tgz" ] \
            || { echo "::error::packed $FORGE, expected runward-forge-$VERSION.tgz (the two packages share one version)"; exit 1; }
          test -s "$FORGE"
          echo "forge=$FORGE" >> "$GITHUB_OUTPUT"

      # The qualification kit (ADR-0087, decision 1): the cited tests, the runner, the requirements
      # and the open anomalies of this tree, plus the SHA-256 of every file of the tarball packed
      # above. Built from the commit through git, so nothing untracked enters it, and deterministic,
      # so the caller can rebuild it and refuse a kit that differs.
      - name: Build the qualification kit from this tree and the tarball
        id: kit
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          node scripts/build-qualification-kit.mjs --tarball "$TARBALL" --out .
          VERSION=$(node -p 'require("./package.json").version')
          KIT="runward-qualification-kit-$VERSION.tgz"
          test -s "$KIT"
          echo "kit=$KIT" >> "$GITHUB_OUTPUT"

      # What the signing job will attest, hashed here and declared as job outputs: the signing job
      # refuses a downloaded file whose digest is not one of these.
      - name: Hash what the signing job will attest
        id: digests
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          KIT: ${{ steps.kit.outputs.kit }}
          FORGE: ${{ steps.forge_pack.outputs.forge }}
        run: |
          set -euo pipefail
          for v in TARBALL KIT FORGE; do test -s "${!v}"; done
          {
            echo "tarball_sha256=$(sha256sum "$TARBALL" | cut -d' ' -f1)"
            echo "kit_sha256=$(sha256sum "$KIT" | cut -d' ' -f1)"
            echo "forge_sha256=$(sha256sum "$FORGE" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
          sha256sum "$TARBALL" "$KIT" "$FORGE"

      - name: Hand the unsigned tarballs and the kit to the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-build-unsigned
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.kit.outputs.kit }}
            ${{ steps.forge_pack.outputs.forge }}
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Attest provenance (signs, builds nothing)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # what the attestation actions read of the repository; no step here checks it out
      id-token: write # Sigstore signing of the provenance happens HERE, in a job that runs no build step
      attestations: write
    steps:
      - name: Download the unsigned tarballs and the kit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: isolated-build-unsigned

      # The build job ran every development dependency; this job signs only the files it declared,
      # under the names a release expects, and refuses anything else.
      - name: The files are the ones the build job hashed, under the expected names
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          KIT: ${{ needs.build.outputs.kit }}
          FORGE: ${{ needs.build.outputs.forge }}
          TARBALL_SHA256: ${{ needs.build.outputs.tarball_sha256 }}
          KIT_SHA256: ${{ needs.build.outputs.kit_sha256 }}
          FORGE_SHA256: ${{ needs.build.outputs.forge_sha256 }}
        run: |
          set -euo pipefail
          [[ "$TARBALL" =~ ^runward-([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)\.tgz$ ]] \
            || { echo "::error::the build job declared the tarball '$TARBALL', not runward-X.Y.Z.tgz — refusing to sign"; exit 1; }
          VERSION="${BASH_REMATCH[1]}"
          [ "$KIT" = "runward-qualification-kit-$VERSION.tgz" ] && [ "$FORGE" = "runward-forge-$VERSION.tgz" ] \
            || { echo "::error::the build job declared '$KIT' and '$FORGE' beside runward-$VERSION.tgz — refusing to sign"; exit 1; }
          check() {
            local got
            got=$(sha256sum "$1" | cut -d' ' -f1)
            echo "$1: $got"
            [ "$got" = "$2" ] || { echo "::error::$1 hashes to $got, the build job declared $2 — refusing to sign"; exit 1; }
          }
          check "$TARBALL" "$TARBALL_SHA256"
          check "$KIT" "$KIT_SHA256"
          check "$FORGE" "$FORGE_SHA256"

      - name: Attest build provenance for the tarball
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ needs.build.outputs.tarball }}

      - name: Attest build provenance for the runward-forge tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ needs.build.outputs.forge }}

      - name: Attest build provenance for the qualification kit
        id: kit_provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ needs.build.outputs.kit }}

      # Deterministic filenames for the artifact hand-off: the caller attaches these bundles to the
      # release, and a missing or empty one must red the build here rather than surface as a
      # half-attached release later.
      - name: Stage the artifact hand-off
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          KIT_BUNDLE: ${{ steps.kit_provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE"
          test -s "$KIT_BUNDLE"
          cp "$BUNDLE" provenance-bundle.jsonl
          cp "$KIT_BUNDLE" kit-provenance-bundle.jsonl

      - name: Hand the tarballs, the kit and their provenance to the caller
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-build
          path: |
            ${{ needs.build.outputs.tarball }}
            provenance-bundle.jsonl
            ${{ needs.build.outputs.kit }}
            kit-provenance-bundle.jsonl
            ${{ needs.build.outputs.forge }}
          if-no-files-found: error
          retention-days: 7
