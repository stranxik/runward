name: Build and attest (isolated builder)

# The reusable builder ADR-0049 introduces. GitHub's documentation states: "Reusable workflows can
# provide isolation between the build process and the calling workflow, to meet SLSA v1.0 Build
# Level 3." (docs.github.com/en/actions/concepts/security/artifact-attestations, read 2026-08-11.)
# runward asserts no level anywhere — the quoted sentence is the ceiling, frozen verbatim in
# test/unit/no-overclaim.test.js — but the property behind it is real and a reader can DEMAND it:
#
#   gh attestation verify runward-X.Y.Z.tgz --repo stranxik/runward \
#     --signer-workflow stranxik/runward/.github/workflows/build-and-attest.yml
#
# (and the same for runward-forge-X.Y.Z.tgz and the qualification kit, attested here too).
#
# What the isolation buys, concretely: the provenance for the tarball is SIGNED HERE, in a workflow
# whose steps the calling workflow cannot reach into. A step added to release.yml — the file the
# release event runs, the one an attacker editing the caller would touch — can no longer influence
# what this builder attests, and the signer identity in the certificate names THIS file, which is
# what --signer-workflow pins.
#
# What stays in the caller, and why: `npm publish` remains in release.yml because npm trusted
# publishing validates the CALLING workflow when a reusable workflow is involved
# (docs.npmjs.com/trusted-publishers) and npmjs.com is configured to trust release.yml. The caller
# also re-runs the full test suite and refuses to publish a tarball that does not byte-match its
# own pack of the same commit — so this builder never becomes a single point of silent divergence.
on:
  workflow_call:
    outputs:
      tarball:
        description: "Filename of the packed tarball"
        value: ${{ jobs.build.outputs.tarball }}
      kit:
        description: "Filename of the qualification kit built from the same tree and tarball"
        value: ${{ jobs.build.outputs.kit }}
      forge:
        description: "Filename of the packed runward-forge tarball (packages/runward-forge, same version)"
        value: ${{ jobs.build.outputs.forge }}

permissions: {}

jobs:
  build:
    name: Build, pack and attest provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore signing of the provenance happens HERE, not in the caller
      attestations: write
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      kit: ${{ steps.kit.outputs.kit }}
      forge: ${{ steps.forge_pack.outputs.forge }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Build + unit + smoke + OSCAL schema — the same net the caller runs. Duplicated on purpose:
      # the builder must not attest a tarball it has not seen pass, and the caller must not publish
      # one it has not seen pass. Two nets, two jobs, one commit.
      - name: Verify
        run: npm test

      - name: Pack the tarball
        id: pack
        run: echo "tarball=$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance for the tarball
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      # The second package of this repository (ADR-0094, question 1): runward-forge, released at the
      # SAME version as runward, from the same tag (test/unit/forge-release.test.js refuses a version
      # that differs, and `npm test` above ran it). Packed and attested here, like runward's tarball,
      # so the signer identity names this file for it too and `--signer-workflow` pins it. `npm pack`
      # is run in the package's own directory: what it packs is that directory's `files`, nothing of
      # the root, and the caller packs it again and refuses a tarball that differs by one byte.
      - name: Pack the runward-forge tarball
        id: forge_pack
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          FORGE=$(cd packages/runward-forge && npm pack --silent --pack-destination "$GITHUB_WORKSPACE")
          [ "$FORGE" = "runward-forge-$VERSION.tgz" ] \
            || { echo "::error::packed $FORGE, expected runward-forge-$VERSION.tgz (the two packages share one version)"; exit 1; }
          test -s "$FORGE"
          echo "forge=$FORGE" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance for the runward-forge tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.forge_pack.outputs.forge }}

      # The qualification kit (ADR-0087, decision 1): the cited tests, the runner, the requirements
      # and the open anomalies of this tree, plus the SHA-256 of every file of the tarball packed
      # above. Built from the commit through git, so nothing untracked enters it, and deterministic,
      # so the caller can rebuild it and refuse a kit that differs. Attested here, like the tarball,
      # so `--signer-workflow` names this file for the kit too.
      - name: Build the qualification kit from this tree and the tarball
        id: kit
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          node scripts/build-qualification-kit.mjs --tarball "$TARBALL" --out .
          VERSION=$(node -p 'require("./package.json").version')
          KIT="runward-qualification-kit-$VERSION.tgz"
          test -s "$KIT"
          echo "kit=$KIT" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance for the qualification kit
        id: kit_provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.kit.outputs.kit }}

      # Deterministic filenames for the artifact hand-off: the caller attaches these bundles to the
      # release, and a missing or empty one must red the build here rather than surface as a
      # half-attached release later.
      - name: Stage the artifact hand-off
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          KIT_BUNDLE: ${{ steps.kit_provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE"
          test -s "$KIT_BUNDLE"
          cp "$BUNDLE" provenance-bundle.jsonl
          cp "$KIT_BUNDLE" kit-provenance-bundle.jsonl

      - name: Hand the tarballs, the kit and their provenance to the caller
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-build
          path: |
            ${{ steps.pack.outputs.tarball }}
            provenance-bundle.jsonl
            ${{ steps.kit.outputs.kit }}
            kit-provenance-bundle.jsonl
            ${{ steps.forge_pack.outputs.forge }}
          if-no-files-found: error
          retention-days: 7
