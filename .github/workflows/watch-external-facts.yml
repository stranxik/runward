# Scheduled watch for dated external facts (ADR-0032).
#
# runward pins facts that live outside the repo and drift on their own clock: the OSCAL schema
# version (NIST ships new releases), and dated regulatory milestones (EU AI Act, FedRAMP). An
# internal drift guard compares repo-to-doc; it can never notice the pinned value fell behind the
# world. This job closes that gap WITHOUT putting a clock in the deterministic gate: it runs on a
# schedule, OUTSIDE the gate, with network, and it never fails the build — it opens (or refreshes)
# a single tracking issue. Bumping a pin stays a deliberate, ADR-traced human decision.
name: watch external facts

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-external-facts
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect drift in dated external facts
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          findings=""

          # 1) OSCAL schema version — pinned in src/lib/compliance.ts (the source of truth).
          pinned="$(sed -n 's/.*OSCAL_VERSION = "\([^"]*\)".*/\1/p' src/lib/compliance.ts | head -n1)"
          latest="$(gh api repos/usnistgov/OSCAL/releases/latest --jq .tag_name 2>/dev/null | sed 's/^v//' || echo "")"
          echo "OSCAL: pinned=$pinned latest=$latest"
          if [ -n "$latest" ] && [ "$pinned" != "$latest" ]; then
            findings="${findings}- **OSCAL**: pinned \`${pinned}\`, latest NIST release \`${latest}\`. runward tracks the current OSCAL release (ADR-0032). Bumping is a versioned-port decision: re-vendor the schema, regen the golden, re-check the trestle proof, and update \`OSCAL_VERSION\` + \`test/oscal-ingest.py\` + the docs in a traced ADR. Confirm the new release is backward-compatible for component-definition first.\n"
          fi

          # Which sheet is a regime's LIVE lens. The product picks the highest shipped version of a
          # regime, lexicographically (src/lib/regimes.ts `loadRegime`, last element of the sort); an
          # older sheet stays shipped only so a pack can be re-assembled against the exact lens its
          # auditor saw (ADR-0022), and its dated wording is SUPPOSED to be frozen. Checking an old
          # lens's reviewBy flagged eu-ai-act@2024-1689 every Monday after 2026-1744 replaced it.
          # Same rule as the product, same sort: C-locale byte order is what JS `.sort()` does here.
          is_live_lens() {
            local base regime newest
            base="$(basename "$1" .json)"; regime="${base%@*}"
            newest="$(ls regimes/"${regime}"@*.json | LC_ALL=C sort | tail -n1)"
            [ "$1" = "$newest" ]
          }

          # 2) Dated regulatory facts — each regimes/*.json may carry a "reviewBy" (ADR-0032).
          today="$(date -u +%F)"
          for f in regimes/*.json; do
            is_live_lens "$f" || { echo "skip $f: superseded lens, frozen by design (ADR-0022)"; continue; }
            rb="$(jq -r '.reviewBy // empty' "$f")"
            [ -z "$rb" ] && continue
            # ISO dates compare lexicographically. "passed" == today is not before reviewBy.
            if [[ ! "$today" < "$rb" ]]; then
              lbl="$(jq -r '.label // .regime' "$f")"
              findings="${findings}- **${lbl}** (\`${f}\`): review-by \`${rb}\` has passed. Re-verify the dated wording (dates, Annex references) against the primary text; if it moved, ship a NEW versioned regime file (never edit a shipped one, ADR-0022) and bump \`reviewBy\`.\n"
            fi
          done

          # 3) The SOURCE itself, not the calendar. A sheet may carry `source.url` +
          #    `source.consolidatedPattern` + `source.consolidatedSeen`. We fetch the page and take the
          #    highest identifier matching the pattern. A newer one means the text moved, and it says so
          #    the Monday after publication instead of the Monday after a date we guessed.
          #
          #    EUR-Lex itself cannot be read this way, from anywhere: it sits behind an AWS WAF that
          #    answers any non-browser client with `202 Accepted`, `x-amzn-waf-action: challenge` and an
          #    EMPTY body (measured 2026-09-24). This check had therefore never run — it reported "could
          #    not reach" every week. The same identifiers are published, for machines, by the EU
          #    Publications Office SPARQL endpoint, which is where EUR-Lex gets them. For an EUR-Lex
          #    source we ask it for every CELEX id that starts with the pattern's root (`02024R1689` for
          #    `02024R1689-[0-9]{8}`), then apply the pattern exactly as before.
          SPARQL="https://publications.europa.eu/webapi/rdf/sparql"
          for f in regimes/*.json; do
            is_live_lens "$f" || continue
            url="$(jq -r '.source.url // empty' "$f")"
            pat="$(jq -r '.source.consolidatedPattern // empty' "$f")"
            seen="$(jq -r '.source.consolidatedSeen // empty' "$f")"
            [ -z "$url" ] || [ -z "$pat" ] || [ -z "$seen" ] && continue
            host="$(printf '%s' "$url" | sed -E 's#^https?://([^/]+).*#\1#')"
            if [ "$host" = "eur-lex.europa.eu" ]; then
              root="${pat%%-*}"
              q="PREFIX cdm: <http://publications.europa.eu/ontology/cdm#> SELECT DISTINCT ?celex WHERE { ?w cdm:resource_legal_id_celex ?celex . FILTER(STRSTARTS(STR(?celex), \"${root}\")) }"
              body="$(curl -sG --max-time 60 "$SPARQL" --data-urlencode "query=${q}" \
                        -H 'Accept: application/sparql-results+json' \
                      | jq -r '.results.bindings[].celex.value' 2>/dev/null || true)"
              asked="the Publications Office SPARQL endpoint (${SPARQL}) for CELEX ids starting \`${root}\`"
            else
              body="$(curl -sL --max-time 30 "$url" || true)"
              asked="\`${url}\`"
            fi
            if [ -z "$body" ]; then
              findings="${findings}- **$(jq -r '.label // .regime' "$f")** (\`${f}\`): could not read ${asked}. Not a finding about the text: a finding about the watch. Check the source by hand.\n"
              continue
            fi
            newest="$(printf '%s' "$body" | grep -oE "$pat" | sort -u | tail -n1 || true)"
            if [ -n "$newest" ] && [ "$newest" != "$seen" ]; then
              findings="${findings}- **$(jq -r '.label // .regime' "$f")** (\`${f}\`): the source now serves \`${newest}\`, this sheet was written against \`${seen}\`. The text MOVED. Read the consolidated version, then ship a NEW versioned regime file (never edit a shipped one, ADR-0022). This check does not wait for \`reviewBy\`.\n"
            fi
          done

          if [ -z "$findings" ]; then
            echo "has_drift=false" >> "$GITHUB_OUTPUT"
            echo "No drift. All pins current."
          else
            echo "has_drift=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "_This issue is maintained automatically by the \`watch external facts\` workflow (ADR-0032). It reopens/refreshes when a pinned external fact falls behind. Bumping any pin is a deliberate, ADR-traced decision — this job never does it for you._"
              echo ""
              printf '%b' "$findings"
              echo ""
              echo "Last checked: ${today} (UTC)."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      # When nothing drifts, the tracking issue has nothing left to say. Before 2026-09-24 it stayed
      # open after every finding was fixed, because only the drift branch ever touched it: eight
      # resolved issues had to be closed by hand. The watch now closes what it opened, citing the
      # run that proves the pins are current. Same exact-title match as below, never a search.
      - name: Close the tracking issue when nothing drifts
        if: steps.scan.outputs.has_drift == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="chore: dated external fact(s) behind — review pins (OSCAL / regime dates)"
          nums="$(gh issue list --state open --limit 200 --json number,title \
                  | jq -r --arg t "$title" 'map(select(.title == $t)) | .[].number')"
          if [ -z "$nums" ]; then
            echo "No open tracking issue, nothing to close."
            exit 0
          fi
          for num in $nums; do
            gh issue close "$num" --reason completed \
              --comment "Resolved: no dated external fact is behind any more. Proof: ${RUN_URL} (\"No drift. All pins current.\"). This workflow opens a new tracking issue the next time a pin falls behind."
            echo "Closed resolved tracking issue #$num"
          done

      - name: Open or refresh the tracking issue
        if: steps.scan.outputs.has_drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.scan.outputs.body }}
        run: |
          set -euo pipefail
          title="chore: dated external fact(s) behind — review pins (OSCAL / regime dates)"
          # NOT `gh issue list --search "in:title $title"`. GitHub's search parses `chore:` as a
          # qualifier and returns NOTHING for this exact title, so the refresh branch below never ran
          # and every Monday opened a new issue — eight identical ones between 2026-08-03 and
          # 2026-09-21. The open issues are listed and the title is matched exactly, client-side.
          nums="$(gh issue list --state open --limit 200 --json number,title \
                  | jq -r --arg t "$title" 'map(select(.title == $t)) | sort_by(.number) | .[].number')"
          num="$(printf '%s\n' "$nums" | sed '/^$/d' | tail -n1)"
          if [ -n "$num" ]; then
            gh issue edit "$num" --body "$BODY"
            echo "Refreshed issue #$num"
            # Self-healing: if duplicates exist (the old search bug, or a race), keep the newest.
            for dup in $(printf '%s\n' "$nums" | sed '/^$/d' | sed '$d'); do
              gh issue close "$dup" --reason "not planned" --comment "Duplicate of #$num, which this workflow keeps refreshed."
              echo "Closed duplicate #$dup"
            done
          else
            gh label create maintenance --color ededed --description "Housekeeping / pin review" 2>/dev/null || true
            gh issue create --title "$title" --body "$BODY" --label "maintenance"
          fi
