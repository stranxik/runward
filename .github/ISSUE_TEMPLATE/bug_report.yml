name: Bug report
description: Something in the runward CLI or its templates does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. runward is a deterministic, read-only gate, so bugs are usually reproducible. The more exact the reproduction, the faster the fix.
  - type: input
    id: version
    attributes:
      label: runward version
      description: Output of `runward --version` (or the npm version you installed).
      placeholder: "0.14.2"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version (`node --version`) and OS.
      placeholder: "Node 22.4.0, macOS 15"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact command(s), including flags.
      placeholder: "runward check --strict"
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exit code and any output. Paste terminal output verbatim.
      render: shell
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Steps, or a link to a minimal repo/mission that reproduces it. `runward init --example` is a good starting point.
    validations:
      required: false
