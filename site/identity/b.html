<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>runward — proposition b · lumière calme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110F;
    --ink:#F4EFE6;
    --accent:#D9A441;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%}
  body{
    min-height:100svh;
    background:var(--bg);
    color:var(--ink);
    font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;
    position:relative;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:var(--bg)}

  /* ————— matière : halo de lanterne, respiration lente ————— */
  .halo{
    position:fixed;z-index:0;pointer-events:none;
    left:50%;top:42%;
    width:120vmin;height:120vmin;
    transform:translate(-50%,-50%);
    background:
      radial-gradient(closest-side at 50% 50%,
        rgba(217,164,65,.16) 0%,
        rgba(217,164,65,.07) 34%,
        rgba(217,164,65,.025) 55%,
        transparent 72%);
    animation:respiration 9s ease-in-out infinite;
  }
  @keyframes respiration{
    0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1)}
    50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
  }
  @media (prefers-reduced-motion:reduce){
    .halo{animation:none}
  }
  /* vignette de galerie, murs sombres */
  .vignette{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.4) 100%);
  }

  .page{
    position:relative;z-index:2;
    min-height:100svh;
    display:flex;flex-direction:column;
    padding:clamp(1.5rem,4vw,3.5rem) clamp(1.5rem,6vw,6rem);
  }

  /* ————— entête ————— */
  header{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.72rem;letter-spacing:.14em;text-transform:lowercase;
    color:color-mix(in srgb, var(--ink) 45%, var(--bg));
  }
  header .mark{color:var(--ink);font-weight:600;letter-spacing:.18em}

  /* ————— héro, accroché sous la lumière ————— */
  .hero{
    flex:1;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;
    padding:clamp(2rem,6vh,4rem) 0;
  }
  h1{
    font-family:"Instrument Serif",serif;
    font-weight:400;
    font-size:clamp(4.4rem,16vw,15.5rem);
    line-height:.95;
    letter-spacing:.005em;
    color:var(--ink);
    text-shadow:0 0 70px rgba(217,164,65,.18);
  }
  .rule{
    width:clamp(2.6rem,5vw,4.5rem);height:1px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    margin:clamp(1.8rem,4.5vh,3rem) auto clamp(1.4rem,3.5vh,2.2rem);
  }
  .tagline{
    max-width:38ch;
    font-size:clamp(1.05rem,1.6vw,1.3rem);
    line-height:1.6;
    font-weight:400;
    color:color-mix(in srgb, var(--ink) 82%, var(--bg));
  }
  .tagline strong{font-weight:600;color:var(--ink)}

  /* ————— bloc terminal — l'objet étranger, identique partout ————— */
  .terminal{
    margin-top:clamp(2rem,5vh,3.2rem);
    width:min(430px,100%);
    background:#000;
    color:#E8E8E8;
    font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.95rem;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 28px 60px -28px rgba(0,0,0,.5);
  }
  .terminal-bar{
    display:flex;gap:7px;
    padding:12px 14px;
    background:#0A0A0A;
    border-bottom:1px solid #1C1C1C;
  }
  .terminal-bar span{width:10px;height:10px;border-radius:50%;background:#2E2E2E}
  .terminal-body{
    display:flex;gap:12px;align-items:baseline;
    padding:20px 22px 24px;
    white-space:nowrap;
    text-align:left;
  }
  .terminal-body .prompt{color:#6F6F6F}
  .terminal-body .caret{
    display:inline-block;width:9px;height:1.05em;
    background:#E8E8E8;transform:translateY(3px);
  }
  /* posé sur son socle, comme une pièce exposée */
  .socle{display:flex;justify-content:center}
  .socle .terminal{outline:1px solid rgba(244,239,230,.08)}

  /* ————— pied ————— */
  footer{
    text-align:center;
    font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.68rem;letter-spacing:.16em;
    color:color-mix(in srgb, var(--ink) 38%, var(--bg));
  }
</style>
</head>
<body>
  <div class="halo" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="page">
    <header>
      <span class="mark">runward</span>
      <span>identity</span>
    </header>

    <main class="hero">
      <h1>RUNWARD</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="tagline">Votre agent de code construit vite. <strong>Runward encadre ce qu'il construit.</strong></p>

      <div class="socle">
        <div class="terminal" role="figure" aria-label="commande d'installation">
          <div class="terminal-bar" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="terminal-body">
            <span class="prompt">$</span>
            <code>npx runward init</code>
            <span class="caret" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </main>

    <footer>proposition b · runward identity</footer>
  </div>
</body>
</html>
