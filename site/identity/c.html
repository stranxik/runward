<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>runward — proposition c · encre lavée</title>
<style>
  :root{
    --bg:#1E2A44;
    --ink:#EFF1F0;
    --accent:#B0703C;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%}
  body{
    min-height:100svh;
    background:var(--bg);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    position:relative;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:var(--bg)}

  /* ————— matière : lavis d'encre, nappes diluées ————— */
  .lavis{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(70px)}
  .lavis span{position:absolute;border-radius:50%}
  .lavis .n1{
    width:70vmax;height:52vmax;left:-12%;top:6%;
    background:radial-gradient(ellipse at 45% 50%, rgba(239,241,240,.075), transparent 62%);
  }
  .lavis .n2{
    width:56vmax;height:60vmax;right:-14%;bottom:-18%;
    background:radial-gradient(ellipse at 50% 40%, rgba(10,16,32,.5), transparent 64%);
  }
  .lavis .n3{
    width:44vmax;height:34vmax;left:34%;top:48%;
    background:radial-gradient(ellipse at 50% 50%, rgba(176,112,60,.10), transparent 60%);
  }
  .nappe{
    position:fixed;inset:-20%;z-index:0;pointer-events:none;
    animation:dilution 34s ease-in-out infinite alternate;
  }
  @keyframes dilution{
    from{transform:translate3d(0,0,0)}
    to{transform:translate3d(-2.5%,2%,0)}
  }
  @media (prefers-reduced-motion:reduce){
    .nappe{animation:none}
  }
  /* traces de brosse, à peine */
  .traces{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(
      104deg,
      transparent 0px,
      transparent 140px,
      rgba(239,241,240,.016) 140px,
      rgba(239,241,240,.016) 190px,
      transparent 190px,
      transparent 360px
    );
  }

  .page{
    position:relative;z-index:2;
    min-height:100svh;
    display:flex;flex-direction:column;
    padding:clamp(1.5rem,4vw,3.5rem) clamp(1.5rem,6vw,6rem);
  }

  /* ————— entête ————— */
  header{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.72rem;letter-spacing:.14em;text-transform:lowercase;
    color:color-mix(in srgb, var(--ink) 48%, var(--bg));
  }
  header .mark{color:var(--ink);font-weight:500;letter-spacing:.18em}

  /* ————— héro, aligné sur une marge ferme ————— */
  .hero{
    flex:1;
    display:flex;flex-direction:column;justify-content:center;
    padding:clamp(2rem,6vh,4rem) 0;
    border-left:1px solid color-mix(in srgb, var(--ink) 14%, transparent);
    padding-left:clamp(1.4rem,3.5vw,3rem);
    margin-left:2px;
  }
  h1{
    font-weight:700;
    font-size:clamp(4rem,14.5vw,13.5rem);
    line-height:.94;
    letter-spacing:-.045em;
    color:var(--ink);
  }
  .rule{
    width:clamp(2.8rem,5.5vw,5rem);height:2px;
    background:var(--accent);
    margin:clamp(1.6rem,4vh,2.8rem) 0 clamp(1.2rem,3vh,2rem);
  }
  .tagline{
    max-width:36ch;
    font-size:clamp(1.05rem,1.6vw,1.32rem);
    line-height:1.58;
    font-weight:400;
    letter-spacing:.002em;
    color:color-mix(in srgb, var(--ink) 84%, var(--bg));
  }
  .tagline strong{font-weight:600;color:var(--ink)}

  /* ————— bloc terminal — l'objet étranger, identique partout ————— */
  .terminal{
    margin-top:clamp(2rem,5vh,3.2rem);
    width:min(430px,100%);
    background:#000;
    color:#E8E8E8;
    font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.95rem;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 28px 60px -28px rgba(0,0,0,.5);
  }
  .terminal-bar{
    display:flex;gap:7px;
    padding:12px 14px;
    background:#0A0A0A;
    border-bottom:1px solid #1C1C1C;
  }
  .terminal-bar span{width:10px;height:10px;border-radius:50%;background:#2E2E2E}
  .terminal-body{
    display:flex;gap:12px;align-items:baseline;
    padding:20px 22px 24px;
    white-space:nowrap;
  }
  .terminal-body .prompt{color:#6F6F6F}
  .terminal-body .caret{
    display:inline-block;width:9px;height:1.05em;
    background:#E8E8E8;transform:translateY(3px);
  }

  /* ————— pied ————— */
  footer{
    font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.68rem;letter-spacing:.16em;
    color:color-mix(in srgb, var(--ink) 42%, var(--bg));
  }
</style>
</head>
<body>
  <div class="nappe" aria-hidden="true">
    <div class="lavis"><span class="n1"></span><span class="n2"></span><span class="n3"></span></div>
  </div>
  <div class="traces" aria-hidden="true"></div>

  <div class="page">
    <header>
      <span class="mark">runward</span>
      <span>identity</span>
    </header>

    <main class="hero">
      <h1>RUNWARD</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="tagline">Votre agent de code construit vite. <strong>Runward encadre ce qu'il construit.</strong></p>

      <div class="terminal" role="figure" aria-label="commande d'installation">
        <div class="terminal-bar" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="terminal-body">
          <span class="prompt">$</span>
          <code>npx runward init</code>
          <span class="caret" aria-hidden="true"></span>
        </div>
      </div>
    </main>

    <footer>proposition c · runward identity</footer>
  </div>
</body>
</html>
