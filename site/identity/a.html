<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>runward — proposition a · minéral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..680&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2EFE9;
    --ink:#1C1A17;
    --accent:#C4502A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%}
  body{
    min-height:100svh;
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    position:relative;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:var(--bg)}

  /* ————— matière : vapeur chaude, dérive lente ————— */
  .vapor{position:fixed;inset:-25%;z-index:0;pointer-events:none}
  .vapor::before,
  .vapor::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
  }
  .vapor::before{
    width:58vmax;height:58vmax;
    left:2%;top:28%;
    background:radial-gradient(circle at 40% 40%, rgba(196,80,42,.11), transparent 62%);
    animation:derive 30s ease-in-out infinite alternate;
  }
  .vapor::after{
    width:64vmax;height:48vmax;
    right:-8%;top:-4%;
    background:radial-gradient(circle at 55% 45%, rgba(28,26,23,.08), transparent 58%);
    animation:derive 30s ease-in-out -15s infinite alternate-reverse;
  }
  @keyframes derive{
    from{transform:translate3d(0,0,0) scale(1)}
    to{transform:translate3d(3.5%,-2.5%,0) scale(1.07)}
  }
  @media (prefers-reduced-motion:reduce){
    .vapor::before,.vapor::after{animation:none}
  }

  /* ————— matière : grain minéral ————— */
  .grain{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    mix-blend-mode:multiply;opacity:.55;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.055'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:260px 260px;
  }

  .page{
    position:relative;z-index:2;
    min-height:100svh;
    display:flex;flex-direction:column;
    padding:clamp(1.5rem,4vw,3.5rem) clamp(1.5rem,6vw,6rem);
  }

  /* ————— entête ————— */
  header{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.72rem;letter-spacing:.14em;text-transform:lowercase;
    color:color-mix(in srgb, var(--ink) 62%, var(--bg));
  }
  header .mark{color:var(--ink);font-weight:600;letter-spacing:.18em}

  /* ————— héro ————— */
  .hero{
    flex:1;
    display:flex;flex-direction:column;justify-content:center;
    padding:clamp(2rem,6vh,4rem) 0;
  }
  h1{
    font-family:"Fraunces",serif;
    font-optical-sizing:auto;
    font-weight:560;
    font-size:clamp(4.2rem,15.5vw,15rem);
    line-height:.92;
    letter-spacing:-.035em;
    color:var(--ink);
  }
  .rule{
    width:clamp(3rem,6vw,5.5rem);height:3px;
    background:var(--accent);
    margin:clamp(1.6rem,4vh,2.8rem) 0 clamp(1.2rem,3vh,2rem);
  }
  .tagline{
    max-width:34ch;
    font-size:clamp(1.05rem,1.6vw,1.35rem);
    line-height:1.55;
    font-weight:400;
    color:color-mix(in srgb, var(--ink) 88%, var(--bg));
  }
  .tagline strong{font-weight:600;color:var(--ink)}

  /* ————— bloc terminal — l'objet étranger, identique partout ————— */
  .terminal{
    margin-top:clamp(2rem,5vh,3.2rem);
    width:min(430px,100%);
    background:#000;
    color:#E8E8E8;
    font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.95rem;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 28px 60px -28px rgba(0,0,0,.5);
  }
  .terminal-bar{
    display:flex;gap:7px;
    padding:12px 14px;
    background:#0A0A0A;
    border-bottom:1px solid #1C1C1C;
  }
  .terminal-bar span{width:10px;height:10px;border-radius:50%;background:#2E2E2E}
  .terminal-body{
    display:flex;gap:12px;align-items:baseline;
    padding:20px 22px 24px;
    white-space:nowrap;
  }
  .terminal-body .prompt{color:#6F6F6F}
  .terminal-body .caret{
    display:inline-block;width:9px;height:1.05em;
    background:#E8E8E8;transform:translateY(3px);
  }

  /* ————— pied ————— */
  footer{
    font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.68rem;letter-spacing:.16em;
    color:color-mix(in srgb, var(--ink) 48%, var(--bg));
  }
</style>
</head>
<body>
  <div class="vapor" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="page">
    <header>
      <span class="mark">runward</span>
      <span>identity</span>
    </header>

    <main class="hero">
      <h1>RUNWARD</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="tagline">Votre agent de code construit vite. <strong>Runward encadre ce qu'il construit.</strong></p>

      <div class="terminal" role="figure" aria-label="commande d'installation">
        <div class="terminal-bar" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="terminal-body">
          <span class="prompt">$</span>
          <code>npx runward init</code>
          <span class="caret" aria-hidden="true"></span>
        </div>
      </div>
    </main>

    <footer>proposition a · runward identity</footer>
  </div>
</body>
</html>
