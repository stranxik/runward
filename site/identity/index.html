<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>runward — identity · trois propositions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..680&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .panels{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    height:100svh;
  }
  @media (max-width:760px){
    .panels{grid-template-columns:1fr;grid-template-rows:repeat(3,1fr)}
  }
  a.panel{
    position:relative;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:clamp(1.5rem,3vw,2.5rem);
    text-decoration:none;
    overflow:hidden;
    transition:filter .35s ease;
  }
  a.panel:hover{filter:brightness(1.06)}
  .letter{
    font-size:clamp(5rem,12vw,11rem);
    line-height:1;
  }
  .meta{display:flex;flex-direction:column;gap:.55rem}
  .name{
    font-size:clamp(1.1rem,1.6vw,1.4rem);
    font-weight:600;letter-spacing:-.01em;
  }
  .hint{
    font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.68rem;letter-spacing:.14em;text-transform:lowercase;
    opacity:.55;
  }
  .accent-rule{width:2.4rem;height:2px;margin-bottom:.4rem}

  /* — a · minéral — */
  .a{background:#F2EFE9;color:#1C1A17}
  .a .letter{font-family:"Fraunces",serif;font-weight:560;letter-spacing:-.03em}
  .a .accent-rule{background:#C4502A}
  /* — b · lumière calme — */
  .b{background:#14110F;color:#F4EFE6}
  .b .letter{font-family:"Instrument Serif",serif;font-weight:400;
    text-shadow:0 0 50px rgba(217,164,65,.3)}
  .b .accent-rule{background:#D9A441}
  .b{background-image:radial-gradient(circle at 50% 30%, rgba(217,164,65,.09), transparent 60%)}
  /* — c · encre lavée — */
  .c{background:#1E2A44;color:#EFF1F0}
  .c .letter{font-weight:700;letter-spacing:-.05em}
  .c .accent-rule{background:#B0703C}
  .c{background-image:radial-gradient(ellipse at 30% 70%, rgba(10,16,32,.5), transparent 65%)}
</style>
</head>
<body>
  <nav class="panels" aria-label="propositions d'identité runward">
    <a class="panel a" href="a.html">
      <span class="letter">A</span>
      <span class="meta">
        <span class="accent-rule" aria-hidden="true"></span>
        <span class="name">Minéral</span>
        <span class="hint">chaux · basalte · terracotta — fraunces</span>
      </span>
    </a>
    <a class="panel b" href="b.html">
      <span class="letter">B</span>
      <span class="meta">
        <span class="accent-rule" aria-hidden="true"></span>
        <span class="name">Lumière calme</span>
        <span class="hint">encre brune · ivoire · ambre — instrument serif</span>
      </span>
    </a>
    <a class="panel c" href="c.html">
      <span class="letter">C</span>
      <span class="meta">
        <span class="accent-rule" aria-hidden="true"></span>
        <span class="name">Encre lavée</span>
        <span class="hint">bleu encre · craie · cuivre — neue haas</span>
      </span>
    </a>
  </nav>
</body>
</html>
